version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    exclude-paths:
      - ".github/workflows/*.lock.yml"
