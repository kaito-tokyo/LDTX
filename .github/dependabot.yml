version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      - ".github/workflows/*.lock.yml"

  # This scope has no Package.swift, so Dependabot discovers the Xcode lock.
  # nanopb is managed outside Dependabot.
  - package-ecosystem: swift
    directory: /LDTX.xcodeproj
    schedule:
      interval: weekly
    allow:
      - dependency-name: github.com/openid/appauth-ios
      - dependency-name: github.com/apple/swift-argument-parser
