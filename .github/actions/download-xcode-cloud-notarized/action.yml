name: Download Xcode Cloud Notarized App
description: Download the latest notarized app artifact produced by an Xcode Cloud tag build.
inputs:
  product_name:
    description: Xcode Cloud product name.
    required: true
  workflow_name:
    description: Xcode Cloud workflow name.
    required: true
  build_run_id:
    description: Optional Xcode Cloud build run ID to reuse instead of rediscovering the tag build.
    required: false
outputs:
  build_id:
    description: Xcode Cloud build ID used to download the artifact.
  artifact_path:
    description: Downloaded notarized app artifact path.
  artifact_file_type:
    description: Xcode Cloud artifact fileType.
  artifact_file_name:
    description: Xcode Cloud artifact filename.
runs:
  using: node24
  main: index.mjs
