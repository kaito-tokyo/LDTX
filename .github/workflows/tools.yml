name: Tools

on:
  workflow_call:

jobs:
  test-release-crash-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test release crash analysis
        shell: bash --noprofile --norc -euo pipefail {0}
        run: python3 -m unittest scripts/test_symbolicate_release_crash.py
