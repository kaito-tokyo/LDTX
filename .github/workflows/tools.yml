name: Tools CI

on:
  workflow_call:

permissions: {}

jobs:
  test-release-crash-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release crash analysis
        shell: bash --noprofile --norc -euo pipefail {0}
        run: python3 -m unittest scripts/test_symbolicate_release_crash.py
