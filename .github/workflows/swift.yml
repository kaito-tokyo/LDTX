name: Swift CI

# file: .github/workflows/plugin-build-macos.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-06-29

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    tags: ['*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    runs-on: macos-26
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Print Xcode version
        id: xcode
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          printf 'version=%s\n' "$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)" | tee -a "$GITHUB_OUTPUT"

      - name: Install xcodegen from Homebrew
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          brew install xcodegen

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          swift build

      - name: Test
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT

          set +e
          swift test 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if awk '/swiftpm-testing-helper/ && /unexpected signal code 11/ { found=1 } END { exit(found?0:1) }' "$log_file"; then
            echo "swiftpm-testing-helper crashed with signal 11 after test execution; retrying once."
            retry_status=0
            swift test 2>&1 | tee -a "$log_file" || retry_status=$?
            exit "$retry_status"
          fi

          exit "$status"
