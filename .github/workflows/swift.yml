name: Swift

on:
  workflow_call:

jobs:
  tahoe:
    runs-on: macos-26
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Print Xcode version
        id: xcode
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          printf 'XCODE_VERSION=%s\n' "$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.XCODE_VERSION }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Test Easy suites
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'EasyTests'

      - name: Test native audio with ThreadSanitizer
        if: always()
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: Tests/LDTXAudioEngineNativeTests/run-tests.sh

      - name: Test module Hard suites
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: >
          swift test --filter 'HardTests'
          --skip 'LDTXIntegrationHardTests'

      - name: Test Integration Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'LDTXIntegrationHardTests'

      - name: Collect Swift test crash diagnostics
        if: failure()
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          diagnostics_directory="${RUNNER_TEMP:?}/swift-test-diagnostics"
          mkdir -p "${diagnostics_directory}"

          for attempt in 1 2 3 4 5 6 7; do
            for reports_directory in \
              "${HOME}/Library/Logs/DiagnosticReports" \
              /Library/Logs/DiagnosticReports
            do
              if [[ -d "${reports_directory}" ]]; then
                find "${reports_directory}" -maxdepth 1 -type f -mmin -30 \
                  \( -name '*LDTXPackageTests*' -o -name '*swiftpm-testing-helper*' \) \
                  -exec cp '{}' "${diagnostics_directory}"/ \;
              fi
            done

            if find "${diagnostics_directory}" -maxdepth 1 -name '*.ips' -print -quit | grep -q .; then
              break
            fi

            if [[ "${attempt}" -lt 7 ]]; then
              sleep 5
            fi
          done

          /usr/bin/log show --last 30m --style compact --info --debug \
            --predicate 'process == "LDTXPackageTests" OR process == "swiftpm-testing-helper" OR subsystem CONTAINS[c] "AVFoundation" OR subsystem CONTAINS[c] "MediaToolbox" OR subsystem CONTAINS[c] "CoreMedia"' \
            > "${diagnostics_directory}/avfoundation.log" || true

      - name: Upload Swift test crash diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-test-crash-diagnostics
          path: ${{ runner.temp }}/swift-test-diagnostics
          if-no-files-found: warn
          retention-days: 1
