name: Swift CI

# file: .github/workflows/plugin-build-macos.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-06-29

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    tags: ['*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    runs-on: macos-26
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Print Xcode version
        if: github.event_name != 'merge_group'
        id: xcode
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          printf 'version=%s\n' "$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        if: github.event_name != 'merge_group'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        if: github.event_name != 'merge_group'
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          swift build

      - name: Test
        if: github.event_name != 'merge_group'
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          swift test

      - name: Parse Swift package sources
        if: github.event_name == 'merge_group'
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          git ls-files -z \
            'Package.swift' \
            'Sources/**/*.swift' \
            'Tests/**/*.swift' \
            ':(exclude)Sources/LDTXApp/**' \
            ':(exclude)Sources/LDTXAppUI/**' \
            ':(exclude)Sources/LDTXQuickLookPreview/**' \
            ':(exclude)Sources/LDTXYouTubeOutputServiceProcess/**' \
            ':(exclude)Tests/LDTXAppTests/**' |
            xargs -0 -n 1 xcrun swiftc -frontend -parse
