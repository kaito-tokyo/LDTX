name: Swift CI

cache-mode: write

on:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corelibs:
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    container:
      image: swift:6.4.0-trixie

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Print Swift version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift --version

      - name: Build and test Corelibs
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --package-path Packages/LDTXCorelibs --disable-index-store -debug-info-format none --jobs "$(nproc)"

  golden_gate:
    runs-on: xcode-27
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Print xcbeautify version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: xcbeautify --version

      - name: Install XcodeGen
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: xcodegen generate

      - name: Build for testing
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTXApp \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            -xcconfig ci_scripts/production-swift-batching.xcconfig \
            -showBuildTimingSummary \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            PROVISIONING_PROFILE= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_PREFIX_MAPPING=YES \
            SWIFT_ENABLE_PROJECT_PREFIX_MAPPING=YES \
            CLANG_ENABLE_PREFIX_MAPPING=YES \
            CLANG_ENABLE_PROJECT_PREFIX_MAPPING=YES \
            'SWIFT_OTHER_PREFIX_MAPPINGS=$(OBJROOT)=/^intermediates' \
            'CLANG_OTHER_PREFIX_MAPPINGS=$(OBJROOT)=/^intermediates' \
            -resultBundlePath "$RUNNER_TEMP/xcodebuild-build.xcresult" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log" | xcbeautify --renderer github-actions

      - name: Test non-UI targets without building
        id: non_ui_tests
        background: true
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          # Hosted arm64 runners cannot execute real Vision OCR integration tests.
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTXApp \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            -skip-testing:LDTXAppUIComponentTests \
            -skip-testing:LDTXModuleTests/WorkspaceClockOCRIntegrationTestSuite \
            -skip-testing:LDTXModuleTests/ManualOCRRecognitionIntegrationTestSuite \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            PROVISIONING_PROFILE= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath "$RUNNER_TEMP/xcodebuild-test.xcresult" \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log" | xcbeautify --renderer github-actions

      - name: Enumerate UI test shards
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTXApp \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            -only-testing:LDTXAppUIComponentTests \
            -enumerate-tests \
            -test-enumeration-style hierarchical \
            -test-enumeration-format json \
            -test-enumeration-output-path "$RUNNER_TEMP/ui-tests.json" \
            test-without-building
          jq -e '
            (.errors | length == 0) and
            ([.values[].children[] | select(.kind == "target" and .name == "LDTXAppUIComponentTests") | .children[]] |
              length == 1 and .[0].name == "AppUIComponentTestSuite" and
              (.[0].children | length >= 2 and all(.[]; .kind == "suite" and (.name | test("^[A-Za-z_][A-Za-z_0-9]*$"))) and
                (map(.name) | length == (unique | length))))
          ' "$RUNNER_TEMP/ui-tests.json" > /dev/null
          jq -r '
            .values[].children[] | select(.kind == "target" and .name == "LDTXAppUIComponentTests") |
            .children[] | select(.name == "AppUIComponentTestSuite") | .children[].name
          ' "$RUNNER_TEMP/ui-tests.json" | LC_ALL=C sort | awk -v dir="$RUNNER_TEMP" '
            { print "LDTXAppUIComponentTests/AppUIComponentTestSuite/" $0 > (dir "/ui-shard-" (1 + (NR + 1) % 2) ".txt") }
          '
          test -s "$RUNNER_TEMP/ui-shard-1.txt"
          test -s "$RUNNER_TEMP/ui-shard-2.txt"

      - name: Test UI shard 1
        id: ui_shard_1
        background: true
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild -skipPackagePluginValidation -project LDTX.xcodeproj -scheme LDTXApp \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData -parallel-testing-enabled YES -parallel-testing-worker-count 1 \
            -only-testing "@$RUNNER_TEMP/ui-shard-1.txt" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE= \
            PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS= COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath "$RUNNER_TEMP/xcodebuild-ui-shard-1.xcresult" \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/xcodebuild-ui-shard-1.log" | xcbeautify --renderer github-actions

      - name: Test UI shard 2
        id: ui_shard_2
        background: true
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild -skipPackagePluginValidation -project LDTX.xcodeproj -scheme LDTXApp \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData -parallel-testing-enabled YES -parallel-testing-worker-count 1 \
            -only-testing "@$RUNNER_TEMP/ui-shard-2.txt" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE= \
            PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS= COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath "$RUNNER_TEMP/xcodebuild-ui-shard-2.xcresult" \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/xcodebuild-ui-shard-2.log" | xcbeautify --renderer github-actions

      - name: Wait for tests
        wait: [non_ui_tests, ui_shard_1, ui_shard_2]

      - name: Run AudioEngine CMake tests with Thread Sanitizer
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          cmake -S . -B build -DLDTX_AUDIO_ENGINE_TSAN=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Run App Automation MCP tests
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_HELPER_EXECUTABLE: .derivedData/Build/Products/Debug/LDTXHelper
        run: Tests/LDTXAppAutomationMCPTests/run-tests.sh

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: xcode-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild-build.log
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/xcodebuild-ui-shard-1.log
            ${{ runner.temp }}/xcodebuild-ui-shard-2.log
            ${{ runner.temp }}/xcodebuild-build.xcresult
            ${{ runner.temp }}/xcodebuild-test.xcresult
            ${{ runner.temp }}/xcodebuild-ui-shard-1.xcresult
            ${{ runner.temp }}/xcodebuild-ui-shard-2.xcresult
            ${{ runner.temp }}/ui-tests.json
            ${{ runner.temp }}/ui-shard-1.txt
            ${{ runner.temp }}/ui-shard-2.txt
          if-no-files-found: warn
