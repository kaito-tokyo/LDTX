name: Swift

on:
  workflow_call:

jobs:
  tahoe:
    runs-on: macos-26
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Print Xcode version
        id: xcode
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          printf 'XCODE_VERSION=%s\n' "$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.XCODE_VERSION }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Test Easy suites
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'EasyTests'

      - name: Test native audio with ThreadSanitizer
        if: always()
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: Tests/LDTXAudioEngineNativeTests/run-tests.sh

      - name: Test Window Lifecycle Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'WindowLifecycleHardTests'

      - name: Test Pane Split View Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'PaneSplitViewHardTests'

      - name: Test Canvas Pair Preview Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'CanvasPairPreviewHardTests'

      - name: Test Workspace Coordinator Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'WorkspaceCoordinatorHardTests'

      - name: Test Background Removal Inference Gate Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'BackgroundRemovalInferenceGateHardTests'

      - name: Test H264 Video Encoder Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'H264VideoEncoderHardTests'

      - name: Test Clock Overlay Runtime Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'ClockOverlayRuntimeHardTests'

      - name: Test Audio Side Stream Pipeline Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'AudioSideStreamSegmentPipelineHardTests'

      - name: Test Manual Capture Pipeline Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'ManualCapturePipelineHardTests'

      - name: Test YouTube Output Media Sample Converter Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'YouTubeOutputMediaSampleConverterHardTests'

      - name: Test YouTube RTMPS Workspace Service Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'YouTubeRTMPSWorkspaceServiceHardTests'

      - name: Test Video Input Preprocessing Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'VideoInputPreprocessingHardTests'

      - name: Test Program Rendering Order Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'ProgramRenderingOrderHardTests'

      - name: Test Video Compositor Hard suite
        if: always()
        timeout-minutes: 30
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: swift test --filter 'VideoCompositorHardTests'

  accept-swift-ci:
    needs:
      - tahoe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check workflow results
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: jq -e 'all(.[]; .result == "success")' <<< "${NEEDS:?}"
