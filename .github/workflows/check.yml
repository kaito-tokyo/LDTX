name: Check CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["*"]

jobs:
  check-clang-format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print clang-format version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          clang-format --version

      - name: Check with clang-format
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs --no-run-if-empty clang-format --dry-run --Werror

  check-swift-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Swiftly
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          SWIFTLY_URL: https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
          SWIFTLY_SHA256: 243af08fa4a216a1d57f62851ae2a6b6eed215130779ce4635fd03adb230044f
        run: |
          curl -fsSL "$SWIFTLY_URL" -o swiftly.tar.gz
          printf '%s  %s\n' "$SWIFTLY_SHA256" swiftly.tar.gz | sha256sum --check --status
          tar -xzf swiftly.tar.gz
          ./swiftly init --quiet-shell-followup --skip-install
          printf '%s\n' "$HOME/.local/share/swiftly/bin" >>"$GITHUB_PATH"

      - name: Install Swift
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          swiftly install
          swiftly link
          swiftly use

      - name: Print swift-format version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          swift format --version

      - name: Check with swift-format
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          swift format lint --strict --recursive .

  check-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install reuse with pipx
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          pipx install reuse
          printf '%s/.local/bin\n' "$HOME" >> "$GITHUB_PATH"

      - name: Check with reuse
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          reuse --no-multiprocessing lint

  accept-check-ci:
    needs:
      - check-clang-format
      - check-swift-format
      - check-reuse
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check workflow results
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: jq -e 'all(.[]; .result == "success")' <<< "${NEEDS:?}"
