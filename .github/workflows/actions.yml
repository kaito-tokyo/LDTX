name: Actions CI

on:
  pull_request:
  workflow_call:

jobs:
  check-release-powershell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check release PowerShell syntax
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $source = Get-Content -LiteralPath '.github/workflows/release.yml' -Raw
          $pattern = '(?ms)^        shell: pwsh[^\n]*\n(?:(?!^        run:).)*^        run: (?:&[\w-]+ )?\|\n(?<script>(?:^          [^\n]*\n|^\n)+)'
          $scripts = [regex]::Matches($source, $pattern)
          if ($scripts.Count -eq 0) { throw 'No inline PowerShell scripts found.' }
          foreach ($script in $scripts) {
              $text = $script.Groups['script'].Value -replace '(?m)^          ', ''
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path 'ci_scripts/AppStoreConnectAuth.psm1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Host "Checked $($scripts.Count) inline PowerShell scripts and the App Store Connect authentication module."
