name: Docs CI

on:
  pull_request:

jobs:
  docs-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Build
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        working-directory: docs
        run: node _BUILD.mjs dist
