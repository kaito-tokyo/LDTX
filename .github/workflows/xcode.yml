name: Xcode CI

# file: .github/workflows/xcode.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-06-29

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    tags: ['*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-build:
    runs-on: macos-26
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Get Xcode version
        if: github.event_name != 'merge_group'
        id: xcode
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          printf 'version=%s\n' "$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)" | tee -a "$GITHUB_OUTPUT"

      - name: Install xcodegen from Homebrew
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          brew install xcodegen

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Xcode cache
        if: github.event_name != 'merge_group'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .derivedData/Build
            .derivedData/SourcePackages
            .derivedData/ModuleCache.noindex
          key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}-
            xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            xcode-${{ runner.os }}-${{ runner.arch }}-

      - name: Xcodegen
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodegen generate

      - name: Build for testing
        if: github.event_name != 'merge_group'
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTX_CI \
            -destination platform=macOS \
            -derivedDataPath .derivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing

      - name: Test
        if: github.event_name != 'merge_group'
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTX_CI \
            -destination platform=macOS \
            -derivedDataPath .derivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test-without-building

      - name: Save Xcode cache
        if: github.event_name != 'merge_group' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .derivedData/Build
            .derivedData/SourcePackages
            .derivedData/ModuleCache.noindex
          key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Parse app sources
        if: github.event_name == 'merge_group'
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          git ls-files -z \
            'Sources/LDTXApp/*.swift' \
            'Sources/LDTXAppUI/*.swift' \
            'Sources/LDTXQuickLookPreview/*.swift' \
            'Sources/LDTXYouTubeOutputServiceProcess/*.swift' \
            'Tests/LDTXAppTests/*.swift' |
            xargs -0 -n 1 xcrun swiftc -frontend -parse
