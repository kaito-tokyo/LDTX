name: Xcode

on:
  workflow_call:

jobs:
  tahoe:
    runs-on: xcode-27
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print xcbeautify version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: xcbeautify --version

      - name: Install XcodeGen
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: brew install xcodegen

      - name: Install Metal Toolchain
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: xcodegen generate

      - name: Cache Swift package dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            .derivedData/SourcePackages/artifacts
            .derivedData/SourcePackages/checkouts
            .derivedData/SourcePackages/repositories
            .derivedData/SourcePackages/workspace-state.json
          key: xcode-27-xcode-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            xcode-27-xcode-spm-

      - name: Resolve external Swift packages
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTX \
            -derivedDataPath .derivedData \
            -resolvePackageDependencies

      - name: Build for testing
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTX \
            -configuration CI \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath "$RUNNER_TEMP/xcodebuild-build.xcresult" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log" | xcbeautify --renderer github-actions

      - name: Test without building
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTX \
            -configuration CI \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath "$RUNNER_TEMP/xcodebuild-test.xcresult" \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log" | xcbeautify --renderer github-actions

      - name: Run AudioEngine CMake tests with Thread Sanitizer
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          cmake -S . -B build -DLDTX_AUDIO_ENGINE_TSAN=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Run CLI tests
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_HELPER_EXECUTABLE: .derivedData/Build/Products/CI/LDTXHelper
        run: Tests/LDTXCLIEasyTests/run-tests.sh

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: xcode-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild-build.log
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/xcodebuild-build.xcresult
            ${{ runner.temp }}/xcodebuild-test.xcresult
          if-no-files-found: warn
