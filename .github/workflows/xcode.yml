name: Xcode CI

# file: .github/workflows/xcode.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-06-29

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    tags: ['*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-build:
    runs-on: macos-26
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Print Xcode version
        id: xcode
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          printf 'version=%s\n' "$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)" | tee -a "$GITHUB_OUTPUT"

      - name: Install xcodegen from Homebrew
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          brew install xcodegen

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Xcode cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .derivedData/Build
            .derivedData/SourcePackages
            .derivedData/ModuleCache.noindex
          key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}-
            xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            xcode-${{ runner.os }}-${{ runner.arch }}-

      - name: Xcodegen
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodegen generate

      - name: Build
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -project LDTX.xcodeproj \
            -scheme LDTX \
            -destination platform=macOS \
            -derivedDataPath .derivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # - name: Build for testing
      #   shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
      #   run: |
      #     xcodebuild \
      #       -project LDTX.xcodeproj \
      #       -scheme LDTX \
      #       -destination platform=macOS \
      #       -derivedDataPath .derivedData \
      #       COMPILER_INDEX_STORE_ENABLE=NO \
      #       CODE_SIGNING_ALLOWED=NO \
      #       build-for-testing

      # - name: Test
      #   shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
      #   run: |
      #     xcodebuild \
      #       -project LDTX.xcodeproj \
      #       -scheme LDTX \
      #       -destination platform=macOS \
      #       -derivedDataPath .derivedData \
      #       COMPILER_INDEX_STORE_ENABLE=NO \
      #       CODE_SIGNING_ALLOWED=NO \
      #       test-without-building

      - name: Save Xcode cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .derivedData/Build
            .derivedData/SourcePackages
            .derivedData/ModuleCache.noindex
          key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
