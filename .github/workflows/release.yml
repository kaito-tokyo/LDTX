name: Release CD

# file: .github/workflows/release.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-07-05

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release-macos
    timeout-minutes: 180

    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Validate release ref
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            printf 'Release workflow must be dispatched against a v-prefixed tag ref; got %s.\n' "$GITHUB_REF" >&2
            exit 1
          fi

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            printf 'Release tag must start with v and contain only SemVer characters; got %s.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Marketing version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          marketing_version="$(
            ruby -e '
              require "yaml"
              spec = YAML.load_file("project.yml")
              value = spec.dig("settings", "base", "MARKETING_VERSION")
              abort("MARKETING_VERSION missing in project.yml") unless value
              puts value
            '
          )"
          expected_version="${GITHUB_REF_NAME#v}"

          if [[ "$marketing_version" != "$expected_version" ]]; then
            printf 'Release tag %s does not match MARKETING_VERSION %s in project.yml.\n' "$GITHUB_REF_NAME" "$marketing_version" >&2
            exit 1
          fi

      - name: Install pinned XcodeGen
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          readonly xcodegen_version=2.46.0
          readonly xcodegen_sha256=4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          readonly xcodegen_archive=xcodegen.zip
          curl --fail --location --silent --show-error \
            --output "$xcodegen_archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${xcodegen_version}/xcodegen.zip"
          echo "$xcodegen_sha256  $xcodegen_archive" | shasum -a 256 --check
          unzip -q "$xcodegen_archive"
          echo "$GITHUB_WORKSPACE/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: xcodegen generate

      - name: Set up Apple code signing
        uses: kaito-tokyo/setup-apple-codesigning@b9f7d7c6819fe6f6bb44694b75963918dcbddd27 # v1.0.0
        with:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Archive Developer ID apps
        id: archive-apps
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ vars.MACOS_SIGNING_APPLICATION_IDENTITY }}
        run: |
          if [[ -z "$MACOS_SIGNING_APPLICATION_IDENTITY" ]]; then
            printf 'MACOS_SIGNING_APPLICATION_IDENTITY is not configured.\n' >&2
            exit 1
          fi

          available_identities="$(security find-identity -v -p codesigning)"
          if [[ "$available_identities" != *"\"$MACOS_SIGNING_APPLICATION_IDENTITY\""* ]]; then
            printf 'Signing identity %s was not found.\n' "$MACOS_SIGNING_APPLICATION_IDENTITY" >&2
            exit 1
          fi

          key_path="$(mktemp -t AuthKey_XXXXXXXX.p8)"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"

          archive_product() {
            local scheme="$1"
            local archive_path="$2"
            local derived_data_path="$3"

            xcodebuild \
              -skipPackagePluginValidation \
              -project LDTX.xcodeproj \
              -scheme "$scheme" \
              -configuration Distribution \
              -destination 'generic/platform=macOS' \
              -archivePath "$archive_path" \
              -derivedDataPath "$derived_data_path" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$key_path" \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER" \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="$MACOS_SIGNING_APPLICATION_IDENTITY" \
              DEVELOPMENT_TEAM=4HMJS6J4MZ \
              COMPILER_INDEX_STORE_ENABLE=NO \
              archive
          }

          ldtx_archive="$RUNNER_TEMP/LDTX.xcarchive"
          ldtx_tiny_archive="$RUNNER_TEMP/LDTXTiny.xcarchive"
          archive_product LDTX "$ldtx_archive" "$RUNNER_TEMP/DerivedData-LDTX"
          archive_product LDTXTiny "$ldtx_tiny_archive" "$RUNNER_TEMP/DerivedData-LDTXTiny"

          printf 'ldtx_archive_path=%s\n' "$ldtx_archive" >> "$GITHUB_OUTPUT"
          printf 'ldtx_app_path=%s\n' "$ldtx_archive/Products/Applications/LDTX.app" >> "$GITHUB_OUTPUT"
          printf 'ldtx_tiny_archive_path=%s\n' "$ldtx_tiny_archive" >> "$GITHUB_OUTPUT"
          printf 'ldtx_tiny_app_path=%s\n' "$ldtx_tiny_archive/Products/Applications/LDTXTiny.app" >> "$GITHUB_OUTPUT"

      - name: Verify app code signature
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_PATH: ${{ steps.archive-apps.outputs.ldtx_app_path }}
        run: |
          if [[ ! -d "$APP_PATH" ]]; then
            printf 'LDTX app bundle was not found at %s.\n' "$APP_PATH" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Verify dSYM matches release app
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_PATH: ${{ steps.archive-apps.outputs.ldtx_app_path }}
          ARCHIVE_PATH: ${{ steps.archive-apps.outputs.ldtx_archive_path }}
        run: |
          dsym_path="$ARCHIVE_PATH/dSYMs/LDTX.app.dSYM"
          if [[ ! -d "$dsym_path" ]]; then
            printf 'Expected main app dSYM was not found at %s\n' "$dsym_path" >&2
            find "$ARCHIVE_PATH/dSYMs" -maxdepth 2 -print >&2
            exit 1
          fi

          app_uuids="$(xcrun dwarfdump --uuid "$APP_PATH/Contents/MacOS/LDTX" | awk '{print $2}' | sort)"
          dsym_uuids="$(xcrun dwarfdump --uuid "$dsym_path" | awk '{print $2}' | sort)"
          if [[ "$app_uuids" != "$dsym_uuids" ]]; then
            printf 'Release app UUIDs do not match dSYM UUIDs.\nApp:\n%s\n\ndSYM:\n%s\n' "$app_uuids" "$dsym_uuids" >&2
            exit 1
          fi

      - name: Validate LDTXTiny archive product
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_PATH: ${{ steps.archive-apps.outputs.ldtx_tiny_app_path }}
        run: |
          if [[ ! -d "$APP_PATH" ]]; then
            printf 'LDTXTiny app bundle was not found at %s.\n' "$APP_PATH" >&2
            exit 1
          fi

          executable_path="$APP_PATH/Contents/MacOS/LDTXTiny"
          if [[ ! -x "$executable_path" ]]; then
            printf 'Expected LDTXTiny executable was not found at %s\n' "$executable_path" >&2
            exit 1
          fi

          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")"
          if [[ "$bundle_identifier" != 'tokyo.kaito.ldtx.LDTXTiny' ]]; then
            printf 'Expected LDTXTiny bundle identifier, got %s in %s\n' "$bundle_identifier" "$APP_PATH" >&2
            exit 1
          fi

      - name: Verify LDTXTiny app code signature
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_PATH: ${{ steps.archive-apps.outputs.ldtx_tiny_app_path }}
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Verify LDTXTiny dSYM matches release app
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_PATH: ${{ steps.archive-apps.outputs.ldtx_tiny_app_path }}
          ARCHIVE_PATH: ${{ steps.archive-apps.outputs.ldtx_tiny_archive_path }}
        run: |
          dsym_path="$ARCHIVE_PATH/dSYMs/LDTXTiny.app.dSYM"
          if [[ ! -d "$dsym_path" ]]; then
            printf 'Expected LDTXTiny app dSYM was not found at %s\n' "$dsym_path" >&2
            find "$ARCHIVE_PATH/dSYMs" -maxdepth 2 -print >&2
            exit 1
          fi

          app_uuids="$(xcrun dwarfdump --uuid "$APP_PATH/Contents/MacOS/LDTXTiny" | awk '{print $2}' | sort)"
          dsym_uuids="$(xcrun dwarfdump --uuid "$dsym_path" | awk '{print $2}' | sort)"
          if [[ "$app_uuids" != "$dsym_uuids" ]]; then
            printf 'LDTXTiny app UUIDs do not match dSYM UUIDs.\nApp:\n%s\n\ndSYM:\n%s\n' "$app_uuids" "$dsym_uuids" >&2
            exit 1
          fi

      - name: Notarize and staple apps
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          LDTX_APP_PATH: ${{ steps.archive-apps.outputs.ldtx_app_path }}
          LDTX_TINY_APP_PATH: ${{ steps.archive-apps.outputs.ldtx_tiny_app_path }}
        run: |
          key_path="$(mktemp -t APP_STORE_CONNECT_KEY)"
          trap 'rm -f "$key_path"' EXIT
          printenv APP_STORE_CONNECT_KEY_BASE64 | base64 -D >"$key_path"
          chmod 600 "$key_path"

          notarize_app() {
            local app_path="$1"
            local product_name="$2"
            local zip_path="$RUNNER_TEMP/${product_name}-${GITHUB_REF_NAME}.app.zip"

            rm -f "$zip_path"
            ditto -c -k --keepParent "$app_path" "$zip_path"
            xcrun notarytool submit "$zip_path" \
              --key "$key_path" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER" \
              --wait

            xcrun stapler staple "$app_path"
            xcrun stapler validate "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --verbose=2 --type execute "$app_path"
          }

          notarize_app "$LDTX_APP_PATH" LDTX
          notarize_app "$LDTX_TINY_APP_PATH" LDTXTiny

      - name: Package release dSYMs
        id: package-dsyms
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_ARCHIVE_PATH: ${{ steps.archive-apps.outputs.ldtx_archive_path }}
          LDTX_TINY_ARCHIVE_PATH: ${{ steps.archive-apps.outputs.ldtx_tiny_archive_path }}
        run: |
          staging_dir="$RUNNER_TEMP/ldtx-dsyms"
          dsym_archive_path="$RUNNER_TEMP/LDTX-${GITHUB_REF_NAME}.dSYMs.cpio.xz"
          rm -rf "$staging_dir" "$dsym_archive_path"
          mkdir -p "$staging_dir/dSYMs/LDTX" "$staging_dir/dSYMs/LDTXTiny"

          ditto "$LDTX_ARCHIVE_PATH/dSYMs" "$staging_dir/dSYMs/LDTX"
          ditto "$LDTX_TINY_ARCHIVE_PATH/dSYMs" "$staging_dir/dSYMs/LDTXTiny"
          rm -rf -- \
            "$staging_dir/dSYMs/LDTX/encuda.dSYM" \
            "$staging_dir/dSYMs/LDTXTiny/encuda.dSYM"
          ditto -c --keepParent "$staging_dir/dSYMs" - | xz -8 -c > "$dsym_archive_path"

          printf 'dsym_archive_path=%s\n' "$dsym_archive_path" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: create-dmg
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_PATH: ${{ steps.archive-apps.outputs.ldtx_app_path }}
        run: |
          staging_dir="$RUNNER_TEMP/ldtx-dmg-staging"
          dmg_path="$RUNNER_TEMP/LDTX-${GITHUB_REF_NAME}.dmg"

          rm -rf "$staging_dir" "$dmg_path"
          mkdir -p "$staging_dir"
          ditto "$APP_PATH" "$staging_dir/LDTX.app"

          create-dmg/create-dmg \
            --volname "LDTX" \
            --window-size 520 320 \
            --icon-size 96 \
            --icon "LDTX.app" 150 145 \
            --hide-extension "LDTX.app" \
            --app-drop-link 370 145 \
            --format ULFO \
            --no-internet-enable \
            --overwrite \
            "$dmg_path" \
            "$staging_dir"

          printf 'dmg_path=%s\n' "$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Create LDTXTiny DMG
        id: create-ldtx-tiny-dmg
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_PATH: ${{ steps.archive-apps.outputs.ldtx_tiny_app_path }}
        run: |
          staging_dir="$RUNNER_TEMP/ldtx-tiny-dmg-staging"
          dmg_path="$RUNNER_TEMP/LDTXTiny-${GITHUB_REF_NAME}.dmg"

          rm -rf "$staging_dir" "$dmg_path"
          mkdir -p "$staging_dir"
          ditto "$APP_PATH" "$staging_dir/LDTXTiny.app"

          create-dmg/create-dmg \
            --volname "LDTX Tiny" \
            --window-size 520 320 \
            --icon-size 96 \
            --icon "LDTXTiny.app" 150 145 \
            --hide-extension "LDTXTiny.app" \
            --app-drop-link 370 145 \
            --format ULFO \
            --no-internet-enable \
            --overwrite \
            "$dmg_path" \
            "$staging_dir"

          printf 'dmg_path=%s\n' "$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMGs
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          LDTX_DMG_PATH: ${{ steps.create-dmg.outputs.dmg_path }}
          LDTX_TINY_DMG_PATH: ${{ steps.create-ldtx-tiny-dmg.outputs.dmg_path }}
        run: |
          key_path="$(mktemp -t APP_STORE_CONNECT_KEY)"
          trap 'rm -f "$key_path"' EXIT
          printenv APP_STORE_CONNECT_KEY_BASE64 | base64 -D >"$key_path"
          chmod 600 "$key_path"

          for dmg_path in "$LDTX_DMG_PATH" "$LDTX_TINY_DMG_PATH"; do
            xcrun notarytool submit "$dmg_path" \
              --key "$key_path" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER" \
              --wait

            xcrun stapler staple "$dmg_path"
            xcrun stapler validate "$dmg_path"
          done

      - name: Verify packaged DMGs
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_DMG_PATH: ${{ steps.create-dmg.outputs.dmg_path }}
          LDTX_TINY_DMG_PATH: ${{ steps.create-ldtx-tiny-dmg.outputs.dmg_path }}
        run: |
          verify_dmg() {
            local dmg_path="$1"
            local app_name="$2"
            local mount_point="$RUNNER_TEMP/mount-${app_name%.app}"

            rm -rf "$mount_point"
            mkdir -p "$mount_point"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path"
            local verification_failed=0

            if [[ ! -d "$mount_point/$app_name" ]]; then
              printf 'Expected %s was not found in %s.\n' "$app_name" "$dmg_path" >&2
              find "$mount_point" -maxdepth 2 -print >&2
              verification_failed=1
            fi

            if [[ ! -L "$mount_point/Applications" || "$(readlink "$mount_point/Applications")" != "/Applications" ]]; then
              printf 'Applications link is missing or invalid in %s.\n' "$dmg_path" >&2
              find "$mount_point" -maxdepth 1 -print >&2
              verification_failed=1
            fi

            if [[ -d "$mount_point/$app_name" ]]; then
              codesign --verify --deep --strict --verbose=2 "$mount_point/$app_name" || verification_failed=1
              xcrun stapler validate "$mount_point/$app_name" || verification_failed=1
              spctl --assess --verbose=2 --type execute "$mount_point/$app_name" || verification_failed=1
            fi
            hdiutil detach "$mount_point"
            return "$verification_failed"
          }

          verify_dmg "$LDTX_DMG_PATH" "LDTX.app"
          verify_dmg "$LDTX_TINY_DMG_PATH" "LDTXTiny.app"

      - name: Attest release assets
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ steps.create-dmg.outputs.dmg_path }}
            ${{ steps.create-ldtx-tiny-dmg.outputs.dmg_path }}

      - name: Create draft release with DMG
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          DSYM_ARCHIVE_PATH: ${{ steps.package-dsyms.outputs.dsym_archive_path }}
          LDTX_DMG_PATH: ${{ steps.create-dmg.outputs.dmg_path }}
          LDTX_TINY_DMG_PATH: ${{ steps.create-ldtx-tiny-dmg.outputs.dmg_path }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --notes "" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi

          ASSETS=(
            "$LDTX_DMG_PATH"
            "$LDTX_TINY_DMG_PATH"
            "$ATTEST_BUNDLE_PATH"
            "$DSYM_ARCHIVE_PATH"
          )

          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
