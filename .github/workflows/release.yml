name: Release CD

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Verify release tag signature
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagObjectSHA = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" `
              --template '{{.object.sha}}'
          $verification = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagObjectSHA" `
              --template '{{.verification.verified}} {{.verification.reason}}'
          $verificationFields = $verification.Trim().Split(' ', 2)
          if ($verificationFields[0] -ne 'true' -or $verificationFields[1] -ne 'valid') {
              throw "Release tag $env:GITHUB_REF_NAME does not have a valid signature: $($verificationFields[1])."
          }

      - name: Verify release commit is reachable from main
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mergeBaseSHA = gh api "repos/$env:GITHUB_REPOSITORY/compare/$env:GITHUB_SHA...main" `
              --template '{{.merge_base_commit.sha}}'
          if ($mergeBaseSHA -ne $env:GITHUB_SHA) {
              throw "Release commit $env:GITHUB_SHA is not reachable from main."
          }

  sign-release:
    needs: validate-release
    runs-on: macos-26
    environment: release-macos
    timeout-minutes: 360

    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create job temp directory
        id: job-temp
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $jobTemp = Join-Path $env:RUNNER_TEMP "$env:GITHUB_JOB-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $jobTemp -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "JOB_TEMP=$jobTemp" -Encoding utf8

      - name: Download LDTX Xcode Cloud Archive artifacts
        id: ldtx-xcode-cloud-archive
        uses: ./.github/actions/download-xcode-cloud-notarized
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
        with:
          product_name: LDTX
          workflow_name: On push tag - LDTX

      - name: Download LDTXTiny Xcode Cloud Archive artifacts
        id: ldtx-tiny-xcode-cloud-archive
        uses: ./.github/actions/download-xcode-cloud-notarized
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
        with:
          product_name: LDTX
          workflow_name: On push tag - LDTXTiny

      - name: Extract Xcode Cloud artifacts
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_APP_ARTIFACT_PATH: ${{ steps.ldtx-xcode-cloud-archive.outputs.ARTIFACT_PATH }}
          LDTX_ARCHIVE_ARTIFACT_PATH: ${{ steps.ldtx-xcode-cloud-archive.outputs.ARCHIVE_ARTIFACT_PATH }}
          LDTX_TINY_APP_ARTIFACT_PATH: ${{ steps.ldtx-tiny-xcode-cloud-archive.outputs.ARTIFACT_PATH }}
          LDTX_TINY_ARCHIVE_ARTIFACT_PATH: ${{ steps.ldtx-tiny-xcode-cloud-archive.outputs.ARCHIVE_ARTIFACT_PATH }}
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
        run: |
          mkdir -p "$JOB_TEMP/LDTX-app" "$JOB_TEMP/LDTX-archive" \
            "$JOB_TEMP/LDTXTiny-app" "$JOB_TEMP/LDTXTiny-archive"

          ditto -x -k "$LDTX_APP_ARTIFACT_PATH" "$JOB_TEMP/LDTX-app" || \
            ditto "$LDTX_APP_ARTIFACT_PATH" "$JOB_TEMP/LDTX-app"
          ditto -x -k "$LDTX_ARCHIVE_ARTIFACT_PATH" "$JOB_TEMP/LDTX-archive" || \
            ditto "$LDTX_ARCHIVE_ARTIFACT_PATH" "$JOB_TEMP/LDTX-archive"
          ditto -x -k "$LDTX_TINY_APP_ARTIFACT_PATH" "$JOB_TEMP/LDTXTiny-app" || \
            ditto "$LDTX_TINY_APP_ARTIFACT_PATH" "$JOB_TEMP/LDTXTiny-app"
          ditto -x -k "$LDTX_TINY_ARCHIVE_ARTIFACT_PATH" "$JOB_TEMP/LDTXTiny-archive" || \
            ditto "$LDTX_TINY_ARCHIVE_ARTIFACT_PATH" "$JOB_TEMP/LDTXTiny-archive"

          ldtx_app_path="$(find "$JOB_TEMP/LDTX-app" -type d -name 'LDTX.app' -print -quit)"
          ldtx_archive_path="$(find "$JOB_TEMP/LDTX-archive" -type d -name '*.xcarchive' -print -quit)"
          ldtx_tiny_app_path="$(find "$JOB_TEMP/LDTXTiny-app" -type d \( -name 'LDTXTiny.app' -o -name 'LDTX.app' \) -print -quit)"
          ldtx_tiny_archive_path="$(find "$JOB_TEMP/LDTXTiny-archive" -type d -name '*.xcarchive' -print -quit)"

          [[ -n "$ldtx_app_path" && -n "$ldtx_archive_path" ]] || exit 1
          [[ -n "$ldtx_tiny_app_path" && -n "$ldtx_tiny_archive_path" ]] || exit 1

          ldtx_tiny_bundle_identifier="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
              "$ldtx_tiny_app_path/Contents/Info.plist"
          )"
          [[ "$ldtx_tiny_bundle_identifier" == 'tokyo.kaito.ldtx.LDTXTiny' ]] || {
            printf 'Expected LDTXTiny bundle identifier, found %s.\n' \
              "$ldtx_tiny_bundle_identifier" >&2
            exit 1
          }
          [[ -x "$ldtx_tiny_app_path/Contents/MacOS/LDTXTiny" ]] || {
            printf 'LDTXTiny executable is missing from %s.\n' "$ldtx_tiny_app_path" >&2
            exit 1
          }

          ditto "$ldtx_archive_path" "$JOB_TEMP/LDTX.xcarchive"
          ditto "$ldtx_app_path" "$JOB_TEMP/LDTX.xcarchive/Products/Applications/LDTX.app"
          ditto "$ldtx_tiny_archive_path" "$JOB_TEMP/LDTXTiny.xcarchive"
          ditto "$ldtx_tiny_app_path" "$JOB_TEMP/LDTXTiny.xcarchive/Products/Applications/LDTXTiny.app"

      - name: Prepare App Store Connect key
        id: app-store-connect-key
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
        run: |
          APP_STORE_CONNECT_KEY_PATH="$JOB_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 -D > "$APP_STORE_CONNECT_KEY_PATH"
          chmod 600 "$APP_STORE_CONNECT_KEY_PATH"
          printf 'APP_STORE_CONNECT_KEY_PATH=%s\n' "$APP_STORE_CONNECT_KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify release versions
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTX.xcarchive/Products/Applications/LDTX.app
          LDTX_TINY_APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTXTiny.xcarchive/Products/Applications/LDTXTiny.app
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          for app_path in "$LDTX_APP_PATH" "$LDTX_TINY_APP_PATH"; do
            actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")"
            if [[ "$actual_version" != "$expected_version" ]]; then
              printf 'Release tag %s does not match app version %s in %s.\n' \
                "$GITHUB_REF_NAME" "$actual_version" "$app_path" >&2
              exit 1
            fi
          done

      - name: Verify LDTX dSYM matches release app
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTX.xcarchive/Products/Applications/LDTX.app
          LDTX_ARCHIVE_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTX.xcarchive
        run: |
          dsym_path="$LDTX_ARCHIVE_PATH/dSYMs/LDTX.app.dSYM"
          [[ -d "$dsym_path" ]] || {
            printf 'Expected LDTX app dSYM was not found at %s.\n' "$dsym_path" >&2
            exit 1
          }

          app_uuids="$(xcrun dwarfdump --uuid "$LDTX_APP_PATH/Contents/MacOS/LDTX" | awk '{print $2}' | sort)"
          dsym_uuids="$(xcrun dwarfdump --uuid "$dsym_path" | awk '{print $2}' | sort)"
          [[ "$app_uuids" == "$dsym_uuids" ]] || {
            printf 'LDTX app UUIDs do not match dSYM UUIDs.\nApp:\n%s\n\ndSYM:\n%s\n' \
              "$app_uuids" "$dsym_uuids" >&2
            exit 1
          }

      - name: Verify LDTXTiny dSYM matches release app
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_TINY_APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTXTiny.xcarchive/Products/Applications/LDTXTiny.app
          LDTX_TINY_ARCHIVE_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTXTiny.xcarchive
        run: |
          dsym_path="$LDTX_TINY_ARCHIVE_PATH/dSYMs/LDTXTiny.app.dSYM"
          [[ -d "$dsym_path" ]] || {
            printf 'Expected LDTXTiny app dSYM was not found at %s.\n' "$dsym_path" >&2
            exit 1
          }

          app_uuids="$(xcrun dwarfdump --uuid "$LDTX_TINY_APP_PATH/Contents/MacOS/LDTXTiny" | awk '{print $2}' | sort)"
          dsym_uuids="$(xcrun dwarfdump --uuid "$dsym_path" | awk '{print $2}' | sort)"
          [[ "$app_uuids" == "$dsym_uuids" ]] || {
            printf 'LDTXTiny app UUIDs do not match dSYM UUIDs.\nApp:\n%s\n\ndSYM:\n%s\n' \
              "$app_uuids" "$dsym_uuids" >&2
            exit 1
          }

      - name: Notarize and staple apps
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ steps.app-store-connect-key.outputs.APP_STORE_CONNECT_KEY_PATH }}
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
          LDTX_APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTX.xcarchive/Products/Applications/LDTX.app
          LDTX_TINY_APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTXTiny.xcarchive/Products/Applications/LDTXTiny.app
        run: |
          notarize_app() {
            local app_path="$1"
            local product_name="$2"
            local zip_path="$JOB_TEMP/${product_name}-${GITHUB_REF_NAME}.app.zip"

            rm -f "$zip_path"
            ditto -c -k --keepParent "$app_path" "$zip_path"
            xcrun notarytool submit "$zip_path" \
              --key "$APP_STORE_CONNECT_KEY_PATH" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER" \
              --wait

            xcrun stapler staple "$app_path"
            xcrun stapler validate "$app_path"
          }

          notarize_app "$LDTX_APP_PATH" LDTX
          notarize_app "$LDTX_TINY_APP_PATH" LDTXTiny

      - name: Package release dSYMs
        id: package-dsyms
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
          LDTX_ARCHIVE_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTX.xcarchive
          LDTX_TINY_ARCHIVE_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTXTiny.xcarchive
        run: |
          staging_dir="$JOB_TEMP/ldtx-dsyms"
          dsym_archive_path="$JOB_TEMP/LDTX-${GITHUB_REF_NAME}.dSYMs.cpio.xz"
          rm -rf "$staging_dir" "$dsym_archive_path"
          mkdir -p "$staging_dir/dSYMs/LDTX" "$staging_dir/dSYMs/LDTXTiny"

          ditto "$LDTX_ARCHIVE_PATH/dSYMs" "$staging_dir/dSYMs/LDTX"
          ditto "$LDTX_TINY_ARCHIVE_PATH/dSYMs" "$staging_dir/dSYMs/LDTXTiny"
          rm -rf -- \
            "$staging_dir/dSYMs/LDTX/encuda.dSYM" \
            "$staging_dir/dSYMs/LDTXTiny/encuda.dSYM"
          ditto -c --keepParent "$staging_dir/dSYMs" - | xz -8 -c > "$dsym_archive_path"

          printf 'DSYM_ARCHIVE_PATH=%s\n' "$dsym_archive_path" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: create-dmg
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTX.xcarchive/Products/Applications/LDTX.app
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
        run: |
          staging_dir="$JOB_TEMP/ldtx-dmg-staging"
          dmg_path="$JOB_TEMP/LDTX-${GITHUB_REF_NAME}.dmg"

          rm -rf "$staging_dir" "$dmg_path"
          mkdir -p "$staging_dir"
          ditto "$LDTX_APP_PATH" "$staging_dir/LDTX.app"

          create-dmg/create-dmg \
            --volname "LDTX" \
            --window-size 520 320 \
            --icon-size 96 \
            --icon "LDTX.app" 150 145 \
            --hide-extension "LDTX.app" \
            --app-drop-link 370 145 \
            --format ULFO \
            --no-internet-enable \
            --overwrite \
            "$dmg_path" \
            "$staging_dir"

          printf 'LDTX_DMG_PATH=%s\n' "$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Create LDTXTiny DMG
        id: create-ldtx-tiny-dmg
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          LDTX_TINY_APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/LDTXTiny.xcarchive/Products/Applications/LDTXTiny.app
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
        run: |
          staging_dir="$JOB_TEMP/ldtx-tiny-dmg-staging"
          dmg_path="$JOB_TEMP/LDTXTiny-${GITHUB_REF_NAME}.dmg"

          rm -rf "$staging_dir" "$dmg_path"
          mkdir -p "$staging_dir"
          ditto "$LDTX_TINY_APP_PATH" "$staging_dir/LDTXTiny.app"

          create-dmg/create-dmg \
            --volname "LDTX Tiny" \
            --window-size 520 320 \
            --icon-size 96 \
            --icon "LDTXTiny.app" 150 145 \
            --hide-extension "LDTXTiny.app" \
            --app-drop-link 370 145 \
            --format ULFO \
            --no-internet-enable \
            --overwrite \
            "$dmg_path" \
            "$staging_dir"

          printf 'LDTX_TINY_DMG_PATH=%s\n' "$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMGs
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ steps.app-store-connect-key.outputs.APP_STORE_CONNECT_KEY_PATH }}
          LDTX_DMG_PATH: ${{ steps.create-dmg.outputs.LDTX_DMG_PATH }}
          LDTX_TINY_DMG_PATH: ${{ steps.create-ldtx-tiny-dmg.outputs.LDTX_TINY_DMG_PATH }}
        run: |
          for dmg_path in "$LDTX_DMG_PATH" "$LDTX_TINY_DMG_PATH"; do
            xcrun notarytool submit "$dmg_path" \
              --key "$APP_STORE_CONNECT_KEY_PATH" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER" \
              --wait

            xcrun stapler staple "$dmg_path"
            xcrun stapler validate "$dmg_path"
          done

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.create-dmg.outputs.LDTX_DMG_PATH }}
            ${{ steps.create-ldtx-tiny-dmg.outputs.LDTX_TINY_DMG_PATH }}
            ${{ steps.package-dsyms.outputs.DSYM_ARCHIVE_PATH }}

      - name: Create or update draft GitHub release
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          DSYM_ARCHIVE_PATH: ${{ steps.package-dsyms.outputs.DSYM_ARCHIVE_PATH }}
          LDTX_DMG_PATH: ${{ steps.create-dmg.outputs.LDTX_DMG_PATH }}
          LDTX_TINY_DMG_PATH: ${{ steps.create-ldtx-tiny-dmg.outputs.LDTX_TINY_DMG_PATH }}
        run: |
          release_is_draft="$(
            gh release view "$GITHUB_REF_NAME" \
              --json isDraft \
              --template '{{.isDraft}}' 2>/dev/null || true
          )"
          if [[ -z "$release_is_draft" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --notes "" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          elif [[ "$release_is_draft" != 'true' ]]; then
            printf 'Release %s is already published; refusing to replace its assets.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          ASSETS=(
            "$LDTX_DMG_PATH"
            "$LDTX_TINY_DMG_PATH"
            "$DSYM_ARCHIVE_PATH"
          )

          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber

          release_assets="$(
            gh release view "$GITHUB_REF_NAME" \
              --json assets \
              --jq '.assets[].name'
          )"
          while IFS= read -r asset_name; do
            [[ -n "$asset_name" ]] || continue
            if [[ "$asset_name" == "${LDTX_DMG_PATH##*/}" || \
                  "$asset_name" == "${LDTX_TINY_DMG_PATH##*/}" || \
                  "$asset_name" == "${DSYM_ARCHIVE_PATH##*/}" ]]; then
              continue
            fi
            gh release delete-asset "$GITHUB_REF_NAME" "$asset_name" --yes
          done <<< "$release_assets"
