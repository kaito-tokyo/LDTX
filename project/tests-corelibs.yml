targets:
  LDTXCorelibsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Packages/LDTXCorelibs/Tests
    dependencies:
      - package: Corelibs
        product: LDTXCorelibs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXCorelibsTests

schemes:
  LDTXCorelibsTests:
    build:
      targets:
        LDTXCorelibsTests: all
    test:
      config: Debug
      targets:
        - LDTXCorelibsTests
