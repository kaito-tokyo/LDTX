targets:
  LDTXHardTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/LDTXHardTests
    dependencies:
      - target: LDTXApp
    settings:
      base:
        TEST_TARGET_NAME: LDTXApp
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXHardTests

schemes:
  LDTXHardTests:
    build:
      targets:
        LDTXApp: all
        LDTXHardTests: all
    test:
      config: Debug
      targets:
        - LDTXHardTests
