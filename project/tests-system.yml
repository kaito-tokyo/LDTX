targets:
  LDTXPaneSplitViewControllerSystemTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXPaneSplitViewControllerSystemTests
    dependencies:
      - target: LDTXAppletSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXPaneSplitViewControllerSystemTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx

  LDTXWorkspaceWindowCloseCoordinatorSystemTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXWorkspaceWindowCloseCoordinatorSystemTests
    dependencies:
      - target: LDTXWorkspaceAppletUI
      - target: LDTXWorkspaceAppletController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXWorkspaceWindowCloseCoordinatorSystemTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx

schemes:
  LDTXPaneSplitViewControllerSystemTests:
    build:
      targets:
        LDTXPaneSplitViewControllerSystemTests: all
    test:
      config: Debug
      targets:
        - LDTXPaneSplitViewControllerSystemTests

  LDTXWorkspaceWindowCloseCoordinatorSystemTests:
    build:
      targets:
        LDTXWorkspaceWindowCloseCoordinatorSystemTests: all
    test:
      config: Debug
      targets:
        - LDTXWorkspaceWindowCloseCoordinatorSystemTests
