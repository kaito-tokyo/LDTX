targets:
  LDTXAudioEngineSwiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAudioEngineSwiftTests
    dependencies:
      - target: LDTXAudioEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAudioEngineSwiftTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Sources/LDTXAudioEngine/include"

schemes:
  LDTXAudioEngineSwiftTests:
    build:
      targets:
        LDTXAudioEngineSwiftTests: all
    test:
      config: Debug
      targets:
        - LDTXAudioEngineSwiftTests
