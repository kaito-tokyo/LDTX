targets:
  LDTXAudioRuntimeHardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXProgramRuntimeHardTests
    dependencies:
      - target: LDTXProgramRuntime
      - target: LDTXAudioEngine
      - target: LDTXCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AudioRuntimeHardTests
  LDTXAppLifecycleHardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppHardTests
    dependencies:
      - target: LDTXApp
      - target: LDTXWorkspaceApplet
      - target: LDTXRecordPlayerApplet
      - target: LDTXAudioEngine
      - target: LDTXCapture
      - target: LDTXDiagnostics
      - target: LDTXInternalProtocols
      - target: LDTXProgram
      - target: LDTXProgramRuntime
      - target: LDTXRecording
      - target: LDTXVideoComposition
      - target: LDTXVideoRendering
      - target: LDTXVision
      - target: LDTXYouTubeAuth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AppLifecycleHardTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LDTXBackgroundSegmentationHardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LDTXBackgroundSegmentationHardTests]
    dependencies: [{target: LDTXBackgroundSegmentation}]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXBackgroundSegmentationHardTests, GENERATE_INFOPLIST_FILE: YES}}
  LDTXProgramHardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LDTXProgramHardTests]
    dependencies: [{target: LDTXProgram}, {target: LDTXProgramRendering}, {target: LDTXVideoComposition}, {package: SwiftProtobuf, product: SwiftProtobuf}]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXProgramHardTests, GENERATE_INFOPLIST_FILE: YES}}
  LDTXProgramRuntimeHardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LDTXProgramRuntimeHardTests]
    dependencies: [{target: LDTXAudioEngine}, {target: LDTXCapture}, {target: LDTXDash}, {target: LDTXInternalProtocols}, {target: LDTXMP4}, {target: LDTXProgram}, {target: LDTXProgramRuntime}]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXProgramRuntimeHardTests, GENERATE_INFOPLIST_FILE: YES}}
  LDTXIntegrationHardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LDTXIntegrationHardTests]
    dependencies: [{target: LDTXCapture}, {target: LDTXDiagnostics}, {target: LDTXMP4}, {target: LDTXProgramRuntime}, {target: LDTXRecording}, {target: LDTXWorkspace}]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXIntegrationHardTests, GENERATE_INFOPLIST_FILE: YES}}
  LDTXVideoRenderingHardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LDTXVideoRenderingHardTests]
    dependencies: [{target: LDTXProgramRuntime}, {target: LDTXVideoComposition}, {target: LDTXVideoRendering}]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXVideoRenderingHardTests, GENERATE_INFOPLIST_FILE: YES}}
  LDTXAppIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppIntegrationTests
    dependencies:
      - target: LDTXApp
      - target: LDTXWorkspaceApplet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppIntegrationTests
        PRODUCT_NAME: LDTXAppIntegrationTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_TEMP_DIR)/$(CONFIGURATION)/LDTX.build/Objects-normal/$(CURRENT_ARCH)"
