targets:
  LDTXAppHostedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppHostedTests
    dependencies:
      - target: LDTXRichText
      - target: LDTXApp
      - target: LDTXWorkspaceAppletService
      - target: LDTXWorkspaceAppletUI
      - target: LDTXYouTubeAuth
      - package: Corelibs
        product: LDTXCorelibs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppHostedTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_TEMP_DIR)/$(CONFIGURATION)/LDTX.build/Objects-normal/$(CURRENT_ARCH)"

schemes:
  LDTXAppHostedTests:
    build:
      targets:
        LDTXAppHostedTests: all
    test:
      config: Debug
      targets:
        - LDTXAppHostedTests
