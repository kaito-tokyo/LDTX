targets:
  LDTXHelper:
    type: tool
    platform: macOS
    sources:
      - Sources/LDTXHelper
    dependencies:
      - target: LDTXUtils
        embed: false
      - target: LDTXAppHelper
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.Helper
        PRODUCT_NAME: LDTXHelper
        PRODUCT_MODULE_NAME: LDTXHelper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)/LDTXUtils.framework/Modules"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/PackageFrameworks @executable_path/../../Frameworks"
