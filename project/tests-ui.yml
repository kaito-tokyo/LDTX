targets:
  LDTXAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/LDTXAppUITests
    dependencies:
      - target: LDTXApp
      - package: Corelibs
        product: LDTXCorelibs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: LDTXApp

schemes:
  LDTXAppUITests:
    build:
      targets:
        LDTXApp: all
        LDTXAppUITests: all
    test:
      config: Debug
      targets:
        - LDTXAppUITests
