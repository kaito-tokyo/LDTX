targets:
  LDTXOutputTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXOutputTests
    dependencies:
      - target: LDTXWorkspaceAppletInterface
      - package: Corelibs
        product: LDTXCorelibs
      - target: LDTXRichText
      - target: LDTXCapture
      - target: LDTXDash
      - target: LDTXMP4
      - target: LDTXProgramRendering
      - target: LDTXProgramRuntime
      - target: LDTXRecording
      - target: LDTXWorkspaceAppletModel
      - target: LDTXWorkspaceAppletService
      - target: LDTXWorkspaceAppletStore
      - target: LDTXWorkspaceAppletUI
      - target: LDTXYouTubeOutputProtocol
      - target: LDTXYouTubeRTMPS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXOutputTests

schemes:
  LDTXOutputTests:
    build:
      targets:
        LDTXOutputTests: all
    test:
      config: Debug
      targets:
        - LDTXOutputTests
