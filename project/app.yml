targets:
  LDTXAppletSupport:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXAppletSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppletSupport
        PRODUCT_MODULE_NAME: LDTXAppletSupport
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXRecordPlayerApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXRecordPlayerApplet
    dependencies:
      - target: LDTXAppletSupport
      - target: LDTXRecording
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXRecordPlayerApplet
        PRODUCT_MODULE_NAME: LDTXRecordPlayerApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXLauncherApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXLauncherApplet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXLauncherApplet
        PRODUCT_MODULE_NAME: LDTXLauncherApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
  LDTXWorkspaceAppletUI:
    type: framework
    platform: macOS
    sources:
      - Sources/Applets/Workspace/UI
      - path: Resources/LDTX/Metal/AudioPeakMeter.metal
        buildPhase: resources
      - path: Resources/LDTX/Metal/AudioInputSpectrogram.metal
        buildPhase: resources
      - path: Resources/LDTX/MediaPipeSelfieSegmenter.mlpackage
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXAppletSupport
      - target: LDTXWorkspaceAppletModel
      - target: LDTXWorkspaceAppletStore
      - target: LDTXWorkspaceAppletService
      - target: LDTXWorkspaceAppletController
      - target: LDTXAudioEngine
      - target: LDTXBackgroundSegmentation
      - target: LDTXCapture
      - target: LDTXDash
      - target: LDTXDiagnostics
      - target: LDTXInternalProtocols
      - target: LDTXMediaTiming
      - target: LDTXMP4
      - target: LDTXProgram
      - target: LDTXProgramRendering
      - target: LDTXProgramRuntime
      - target: LDTXRecording
      - target: LDTXTaskQueue
      - target: LDTXVideoComposition
      - target: LDTXVideoRendering
      - target: LDTXVision
      - target: LDTXYouTube
      - target: LDTXYouTubeAuth
      - target: LDTXYouTubeOutputProtocol
      - target: LDTXYouTubeRTMPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXWorkspaceAppletUI
        PRODUCT_MODULE_NAME: LDTXWorkspaceAppletUI
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXSettingsApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXSettingsApplet
    dependencies:
      - target: LDTXWorkspaceAppletModel
      - target: LDTXWorkspaceAppletStore
      - target: LDTXYouTube
      - target: LDTXYouTubeAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXSettingsApplet
        PRODUCT_MODULE_NAME: LDTXSettingsApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXApp:
    type: application
    platform: macOS
    sources:
      - Sources/LDTXApp
      - path: Resources/LDTX/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/LDTX/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/Shared/About/Credits.rtf
        buildPhase:
          copyFiles:
            destination: resources
      - path: Sources/LDTXProgramRuntime/Resources/NotoSans/OFL.txt
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXAppletSupport
        embed: true
        codeSign: true
      - target: LDTXLauncherApplet
        embed: true
        codeSign: true
      - target: LDTXRecordPlayerApplet
        embed: true
        codeSign: true
      - target: LDTXWorkspaceAppletUI
        embed: true
        codeSign: true
      - target: LDTXSettingsApplet
        embed: true
        codeSign: true
      - target: LDTXQuickLookPreview
        embed: true
      - target: LDTXQuickLookThumbnail
        embed: true
      - target: LDTXHelper
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXUtils
        embed: true
        codeSign: true
      - target: LDTXAppHelper
        embed: true
        codeSign: true
      - target: LDTXYouTubeOutputServiceProcess
        link: false
        codeSign: true
        embed: true
      - target: LDTXAudioEngine
        embed: true
      - target: LDTXBackgroundSegmentation
        embed: true
      - target: LDTXCapture
        embed: true
      - target: LDTXDash
        embed: true
      - target: LDTXDiagnostics
        embed: true
      - target: LDTXInternalProtocols
        embed: true
      - target: LDTXMediaTiming
        embed: true
      - target: LDTXMP4
        embed: true
      - target: LDTXYouTubeOutputProtocol
        embed: true
      - target: LDTXProgram
        embed: true
      - target: LDTXProgramRendering
        embed: true
      - target: LDTXProgramRuntime
        embed: true
      - target: LDTXTaskQueue
        embed: true
      - target: LDTXRecording
        embed: true
      - target: LDTXVideoComposition
        embed: true
      - target: LDTXVideoRendering
        embed: true
      - target: LDTXVision
        embed: true
      - target: LDTXYouTubeAuth
        embed: true
      - target: LDTXYouTube
        embed: true
      - target: LDTXYouTubeRTMPS
        embed: true
      - target: LDTXWorkspaceAppletModel
        embed: true
      - target: LDTXWorkspaceAppletStore
        embed: true
      - target: LDTXWorkspaceAppletService
        embed: true
      - target: LDTXWorkspaceAppletController
        embed: true
      - target: LDTXFontRasterizer
        embed: true
      - package: SwiftProtobuf
        product: SwiftProtobuf
        embed: false
      - package: AppAuth-iOS
        product: AppAuth
        embed: false
    scripts:
      - name: Embed SwiftProtobuf for LDTXHelper
        script: |
          set -euo pipefail
          framework_dir="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "${framework_dir}"
          for package_framework in "${BUILT_PRODUCTS_DIR}"/PackageFrameworks/SwiftProtobuf*_PackageProduct.framework; do
            test -d "${package_framework}"
            ditto "${package_framework}" "${framework_dir}/$(basename "${package_framework}")"
          done
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local
        PRODUCT_NAME: LDTX
        PRODUCT_MODULE_NAME: LDTXApp
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        LDTX_YOUTUBE_OUTPUT_SERVICE_PROCESS_XPC_SERVICE_NAME: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        LDTX_DOCUMENT_HANDLER_RANK: Owner
        LDTX_MCP_SERVER_NAME: tokyo.kaito.ldtx.app-automation
        LDTX_MCP_SERVER_EXECUTABLE: LDTXHelper
        INFOPLIST_FILE: Sources/LDTXApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DISABLE_DIAMOND_PROBLEM_DIAGNOSTIC: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        CI:
          CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX_CI.entitlements
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX

schemes:
  LDTXApp:
    build:
      targets:
        LDTXApp: all
        LDTXHelper: all
    test:
      config: Debug
      testPlans:
        - path: testall.xctestplan
          defaultPlan: true
    archive:
      config: Distribution
