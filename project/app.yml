targets:
  LDTXAppletSupport:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXAppletSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppletSupport
        PRODUCT_MODULE_NAME: LDTXAppletSupport
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
  LDTXRecordPlayerApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/Applets/RecordPlayer
    dependencies:
      - sdk: AVKit.framework
      - target: LDTXAppletSupport
      - target: LDTXRecording
      - package: Corelibs
        product: LDTXCorelibs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXRecordPlayerApplet
        PRODUCT_MODULE_NAME: LDTXRecordPlayerApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
  LDTXWorkspaceAppletUI:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Applets/Workspace
        includes:
          - UI
      - path: Resources/LDTX/Metal/AudioPeakMeter.metal
        buildPhase: resources
    dependencies:
      - target: LDTXVariableMacro
      - target: LDTXRichText
      - target: LDTXVision
      - target: LDTXBackgroundSegmentation
      - target: LDTXInternalProtocols
      - package: Corelibs
        product: LDTXCorelibs
      - target: LDTXProgramRuntime
      - target: LDTXTaskQueue
      - target: LDTXVideoComposition
      - target: LDTXVideoRendering
      - target: LDTXYouTube
      - target: LDTXAppletSupport
      - target: LDTXCapture
      - target: LDTXDeviceRegistry
      - target: LDTXWorkspaceAppletModel
      - target: LDTXProtosMacOSExtra
      - target: LDTXYouTubeRTMPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXWorkspaceAppletUI
        PRODUCT_MODULE_NAME: LDTXWorkspaceAppletUI
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: >-
            $(inherited) WorkspaceSidebarPreviewFixtures.swift
        Distribution:
          EXCLUDED_SOURCE_FILE_NAMES: >-
            $(inherited) WorkspaceSidebarPreviewFixtures.swift
  LDTXSettingsApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/Applets/Settings
    dependencies:
      - target: LDTXProgramRuntime
      - target: LDTXWorkspaceAppletModel
      - target: LDTXWorkspaceAppletStore
      - target: LDTXYouTube
      - target: LDTXYouTubeAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXSettingsApplet
        PRODUCT_MODULE_NAME: LDTXSettingsApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
  LDTXVisionProgrammerApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/Applets/VisionProgrammer
    dependencies:
      - target: LDTXVisionTraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXVisionProgrammerApplet
        PRODUCT_MODULE_NAME: LDTXVisionProgrammerApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
  LDTXVisionProgrammerApp:
    type: application
    platform: macOS
    sources:
      - Sources/Apps/LDTXVisionProgrammerApp
    dependencies:
      - target: LDTXVisionProgrammerApplet
        embed: true
        codeSign: true
      - target: LDTXVisionTraining
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXVisionProgrammerApp
        PRODUCT_MODULE_NAME: LDTXVisionProgrammerApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
  LDTXApp:
    type: application
    platform: macOS
    sources:
      - Sources/Apps/LDTXApp
      - path: Resources/LDTX/AppIcon.icon
        buildPhase: resources
      - path: Resources/LDTX/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/LDTX/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/Shared/About/Credits.rtf
        buildPhase:
          copyFiles:
            destination: resources
      - path: Resources/LDTX/Fonts/NotoSans/OFL.txt
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXAppletSupport
        embed: true
        codeSign: true
      - target: LDTXRecordPlayerApplet
        embed: true
        codeSign: true
      - target: LDTXVisionProgrammerApplet
        embed: true
        codeSign: true
      - target: LDTXVisionTraining
        embed: true
        codeSign: true
      - target: LDTXSettingsApplet
        embed: true
        codeSign: true
      - target: LDTXQuickLookPreview
        embed: true
      - target: LDTXQuickLookThumbnail
        embed: true
      - target: LDTXHelper
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXUtils
        embed: true
        codeSign: true
      - target: LDTXAppHelper
        embed: true
        codeSign: true
      - target: LDTXYouTubeOutputServiceProcess
        link: false
        codeSign: true
        embed: true
      - target: LDTXAudioEngine
        embed: true
      - target: LDTXBackgroundSegmentation
        embed: true
      - target: LDTXCapture
        embed: true
      - target: LDTXDeviceRegistry
        embed: true
      - target: LDTXDash
        embed: true
      - target: LDTXInternalProtocols
        embed: true
      - target: LDTXMediaTiming
        embed: true
      - target: LDTXMP4
        embed: true
      - target: LDTXYouTubeOutputProtocol
        embed: true
      - package: Corelibs
        product: LDTXCorelibs
        embed: true
      - target: LDTXProgramRendering
        embed: true
      - target: LDTXProgramRuntime
        embed: true
      - target: LDTXTaskQueue
        embed: true
      - target: LDTXRecording
        embed: true
      - target: LDTXVideoComposition
        embed: true
      - target: LDTXVideoRendering
        embed: true
      - target: LDTXVision
        embed: true
      - target: LDTXYouTubeAuth
        embed: true
      - target: LDTXYouTube
        embed: true
      - target: LDTXYouTubeRTMPS
        embed: true
      - target: LDTXWorkspaceAppletModel
        embed: true
      - target: LDTXProtosMacOSExtra
        embed: true
      - target: LDTXWorkspaceAppletStore
        embed: true
      - target: LDTXWorkspaceAppletService
        embed: true
      - target: LDTXVariableMacro
        embed: true
      - target: LDTXRichText
        embed: true
      - target: LDTXWorkspaceAppletController
        embed: true
      - target: LDTXWorkspaceAppletUI
        # The app directly constructs WorkspaceDocument from this UI framework.
        link: true
        embed: true
      - target: LDTXFontRasterizer
        embed: true
      - package: AppAuth-iOS
        product: AppAuth
        embed: false
      - package: swift-argument-parser
        product: ArgumentParser
        # Xcode embeds and signs its synthesized package-product framework.
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX
        PRODUCT_NAME: LDTX
        PRODUCT_MODULE_NAME: LDTXApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        LDTX_YOUTUBE_OUTPUT_SERVICE_PROCESS_XPC_SERVICE_NAME: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        LDTX_DOCUMENT_HANDLER_RANK: Owner
        LDTX_MCP_SERVER_NAME: tokyo.kaito.ldtx.app-automation
        LDTX_MCP_SERVER_EXECUTABLE: LDTXHelper
        INFOPLIST_FILE: Sources/Apps/LDTXApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Apps/LDTXApp/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DISABLE_DIAMOND_PROBLEM_DIAGNOSTIC: "YES"
        DEFINES_MODULE: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"

schemes:
  LDTXVisionProgrammerApp:
    build:
      targets:
        LDTXVisionProgrammerApp: all
    run:
      config: Debug
    management:
      shared: true
  LDTXWorkspaceAppletUI:
    build:
      targets:
        LDTXWorkspaceAppletUI: all
    management:
      shared: true
  LDTXApp:
    build:
      targets:
        LDTXApp: all
        LDTXHelper: all
        ldtx: [test]
    test:
      config: Debug
      testPlans:
        - path: Default.xctestplan
          defaultPlan: true
        - path: LDTXTests.xctestplan
        - path: pr.xctestplan
        - path: push-main.xctestplan
        - path: Easy.xctestplan
        - path: Medium.xctestplan
        - path: Hard.xctestplan
    archive:
      config: Distribution
