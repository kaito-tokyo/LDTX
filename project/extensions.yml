targets:
  LDTXQuickLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Extensions/QuickLookPreview
    info:
      path: Sources/Extensions/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes:
              - tokyo.kaito.ldtx.record
              - tokyo.kaito.ldtx.recording
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: LDTXQuickLookPreviewProvider
    entitlements:
      path: Sources/Extensions/QuickLookPreview/LDTXQuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.QuickLookPreview
        PRODUCT_NAME: LDTXQuickLookPreview
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXQuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Extensions/QuickLookThumbnail
    info:
      path: Sources/Extensions/QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes:
              - tokyo.kaito.ldtx.record
              - tokyo.kaito.ldtx.recording
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: LDTXThumbnailProvider
    entitlements:
      path: Sources/Extensions/QuickLookThumbnail/LDTXQuickLookThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.QuickLookThumbnail
        PRODUCT_NAME: LDTXQuickLookThumbnail
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
