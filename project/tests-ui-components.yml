targets:
  LDTXAppUIComponentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppUIComponentTests
    dependencies:
      - target: LDTXWorkspaceAppletUI
      - target: LDTXWorkspaceAppletModel
      - target: LDTXWorkspaceAppletStore
      - target: LDTXWorkspaceAppletService
      - target: LDTXProgram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppUIComponentTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx

schemes:
  LDTXAppUIComponentTests:
    build:
      targets:
        LDTXAppUIComponentTests: all
    test:
      config: Debug
      targets:
        - LDTXAppUIComponentTests
