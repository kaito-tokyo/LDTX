targets:
  LDTXAppUIComponentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppUIComponentTests
      - path: Sources/Apps/LDTXApp
        includes:
          - AppDelegate.swift
          - WorkspaceNotifications.swift
    dependencies:
      - target: LDTXWorkspaceAppletInterface
      - target: LDTXVariableMacro
      - target: LDTXRichText
      - target: LDTXVisionProgrammerApplet
      - target: LDTXSettingsApplet
      - target: LDTXProgramRuntime
      - target: LDTXAppletSupport
      - target: LDTXWorkspaceAppletController
      - target: LDTXRecordPlayerApplet
      - target: LDTXRecording
      - package: Corelibs
        product: LDTXCorelibs
      - target: LDTXWorkspaceAppletUI
      - target: LDTXWorkspaceAppletModel
      - target: LDTXWorkspaceAppletStore
      - target: LDTXWorkspaceAppletService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppUIComponentTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  LDTXAppUIComponentTests:
    build:
      targets:
        LDTXAppUIComponentTests: all
    test:
      config: Debug
      targets:
        - LDTXAppUIComponentTests
