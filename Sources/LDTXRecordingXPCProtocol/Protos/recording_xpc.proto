syntax = "proto3";

package ldtx.recording.xpc.v1;

message Context {
  string session_id = 1;
  uint64 generation = 2;
}

// Main Program recording owns two SPSC rings: compressed H.264 and compressed
// AAC.  They are separate so the video and audio producer callbacks never
// contend, while one XPC writer owns their final interleaving and durability.
message MainConfigureRequest {
  uint32 protocol_version = 1;
  Context context = 2;
  uint64 video_ring_capacity = 3;
  uint64 audio_ring_capacity = 4;
  uint32 segment_duration_seconds = 5;
}

message MediaTime {
  int64 value = 1;
  int32 timescale = 2;
}

message H264Format {
  repeated bytes parameter_sets = 1;
  int32 nal_unit_header_length = 2;
  int32 width = 3;
  int32 height = 4;
}

message H264AccessUnit {
  MediaTime presentation_time = 1;
  MediaTime decode_time = 2;
  bool decode_time_present = 3;
  MediaTime duration = 4;
  bool key_frame = 5;
  bytes avcc_data = 6;
}

message VideoRingRecord {
  uint64 sequence = 1;
  oneof payload {
    H264Format format = 2;
    H264AccessUnit access_unit = 3;
  }
}

message AACFormat {
  double sample_rate = 1;
  uint32 channels_per_frame = 2;
  bytes magic_cookie = 3;
}

message AACAccessUnit {
  MediaTime presentation_time = 1;
  MediaTime duration = 2;
  uint32 sample_count = 3;
  repeated uint32 sample_sizes = 4;
  bytes data = 5;
}

message AACRingRecord {
  uint64 sequence = 1;
  oneof payload {
    AACFormat format = 2;
    AACAccessUnit access_unit = 3;
  }
}

message FinishRequest {
  Context context = 1;
}

message Reply {
  bool accepted = 1;
  string error_message = 2;
}

message Event {
  Context context = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PREPARED = 1;
    KIND_FRAGMENT_COMMITTED = 2;
    KIND_GENERATION_FINISHED = 3;
    KIND_FAILED = 4;
    KIND_RECOVERED = 5;
  }
  Kind kind = 2;
  string track_id = 3;
  uint64 byte_offset = 4;
  uint64 byte_length = 5;
  int64 presentation_value = 6;
  int32 presentation_timescale = 7;
  int64 duration_value = 8;
  int32 duration_timescale = 9;
  string error_message = 10;
  enum FragmentKind {
    FRAGMENT_KIND_UNSPECIFIED = 0;
    FRAGMENT_KIND_INITIALIZATION = 1;
    FRAGMENT_KIND_MEDIA = 2;
  }
  FragmentKind fragment_kind = 11;
}
