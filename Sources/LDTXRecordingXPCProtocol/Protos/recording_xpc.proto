syntax = "proto3";

package ldtx.recording.xpc.v1;

message Context {
  string session_id = 1;
  uint64 generation = 2;
}

message ConfigureRequest {
  uint32 protocol_version = 1;
  Context context = 2;
  string track_id = 3;
  uint64 ring_capacity = 4;
  uint32 segment_duration_seconds = 5;
}

message MediaTime {
  int64 value = 1;
  int32 timescale = 2;
}

message H264Format {
  repeated bytes parameter_sets = 1;
  int32 nal_unit_header_length = 2;
  int32 width = 3;
  int32 height = 4;
}

message H264AccessUnit {
  MediaTime presentation_time = 1;
  MediaTime decode_time = 2;
  bool decode_time_present = 3;
  MediaTime duration = 4;
  bool key_frame = 5;
  bytes avcc_data = 6;
}

message VideoRingRecord {
  uint64 sequence = 1;
  oneof payload {
    H264Format format = 2;
    H264AccessUnit access_unit = 3;
  }
}

message PCMFormat {
  double sample_rate = 1;
  uint32 format_id = 2;
  uint32 format_flags = 3;
  uint32 bytes_per_packet = 4;
  uint32 frames_per_packet = 5;
  uint32 bytes_per_frame = 6;
  uint32 channels_per_frame = 7;
  uint32 bits_per_channel = 8;
}

message PCMBuffer {
  MediaTime presentation_time = 1;
  MediaTime duration = 2;
  uint32 sample_count = 3;
  bytes data = 4;
}

message AudioRingRecord {
  uint64 sequence = 1;
  oneof payload {
    PCMFormat format = 2;
    PCMBuffer buffer = 3;
  }
}

message CutRequest {
  Context context = 1;
  string cut_id = 2;
  int64 presentation_value = 3;
  int32 presentation_timescale = 4;
}

message FinishRequest {
  Context context = 1;
}

message Reply {
  bool accepted = 1;
  string error_message = 2;
}

message Event {
  Context context = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PREPARED = 1;
    KIND_FRAGMENT_COMMITTED = 2;
    KIND_GENERATION_FINISHED = 3;
    KIND_FAILED = 4;
    KIND_RECOVERED = 5;
  }
  Kind kind = 2;
  string track_id = 3;
  uint64 byte_offset = 4;
  uint64 byte_length = 5;
  int64 presentation_value = 6;
  int32 presentation_timescale = 7;
  int64 duration_value = 8;
  int32 duration_timescale = 9;
  string error_message = 10;
}
