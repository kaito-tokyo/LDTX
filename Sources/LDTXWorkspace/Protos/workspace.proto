syntax = "proto3";

package ldtx.workspace.v1;

import "program.proto";
import "persistence.proto";

message Workspace {
  string id = 1;
  string name = 2;
  repeated ProgramRecord programs = 3;
  // Legacy preferences field. New writers store this in WorkspacePreferences.
  repeated ProgramPreferencesRecord program_preferences = 4 [deprecated = true];
  repeated InputDeviceRecord input_devices = 5;
  repeated ldtx.program.v1.ProgramAudioChannel audio_channels = 6;
  repeated VisionRecord visions = 7;
  repeated AutomationRecord automations = 8;
}

message WorkspacePreferences {
  repeated ProgramPreferencesRecord program_preferences = 1;
  map<string, string> physical_device_ids_by_input_device_id = 2;
  map<string, string> input_camera_device_mappings = 3;
  map<string, string> input_audio_device_mappings = 4;
  repeated string input_audio_monitor_channel_keys = 5;
  optional string selected_program_name = 6;
  OutputPreferences output = 7;
}

message OutputPreferences {
  string capture_output_mode = 1;
  string existing_broadcast_id = 2;
  string stream_title = 3;
  string stream_description = 4;
  bool prefers_color_preview = 5;
  string local_output_base_directory_path = 6;
}

message VisionRecord {
  string id = 1;
  string name = 2;
  oneof source {
    bool current_program_output = 3;
    string input_device_id = 4;
  }
  string model_repository_id = 5;
  optional string model_revision = 6;
  // Legacy field. Decode as system_prompt when system_prompt is absent.
  string prompt = 7;
  string system_prompt = 8;
  string user_prompt = 9;
  // Zero means manual updates.
  double update_interval_seconds = 10;
  bool stops_at_newline = 11;
  optional string post_action_automation_id = 12;
}

message AutomationRecord {
  string id = 1;
  string name = 2;
  bool is_enabled = 3;
  AutomationTrigger trigger = 4;
  repeated AutomationAction actions = 5;
}

message AutomationTrigger {
  oneof definition {
    bool manual = 1;
    double interval_seconds = 2;
    string vision_result_changed_id = 3;
  }
}

message AutomationAction {
  string id = 1;
  oneof definition {
    string analyze_vision_id = 2;
    string select_input_device_id = 3;
  }
}

message ProgramRecord {
  string name = 1;
  uint32 canvas_width = 2;
  uint32 canvas_height = 3;
  uint32 frame_rate_numerator = 4;
  uint32 frame_rate_denominator = 5;
  ldtx.program.v1.Program program = 6;
}

message ProgramPreferencesRecord {
  string name = 1;
  ldtx.program.persistence.v1.ProgramPreferences preferences = 2;
}

message InputDeviceRecord {
  string name = 1;
  InputDeviceKind kind = 2;
  SideTrackRecordingPolicy side_track_recording_policy = 3;
  string id = 4;
  // Legacy preferences field. New writers store this in WorkspacePreferences.
  string physical_device_id = 5 [deprecated = true];
  BackgroundRemovalPolicy background_removal_policy = 6;
  ColorRangePolicy color_range_policy = 7;
  uint32 capture_width_override = 8;
  uint32 capture_height_override = 9;
  uint32 capture_frame_rate_override = 10;
}

enum InputDeviceKind {
  INPUT_DEVICE_KIND_UNSPECIFIED = 0;
  INPUT_DEVICE_KIND_VIDEO = 1;
  INPUT_DEVICE_KIND_AUDIO = 2;
}

enum SideTrackRecordingPolicy {
  SIDE_TRACK_RECORDING_POLICY_UNSPECIFIED = 0;
  SIDE_TRACK_RECORDING_POLICY_ENABLED = 1;
  SIDE_TRACK_RECORDING_POLICY_DISABLED = 2;
}

enum BackgroundRemovalPolicy {
  BACKGROUND_REMOVAL_POLICY_UNSPECIFIED = 0;
  BACKGROUND_REMOVAL_POLICY_ENABLED = 1;
  BACKGROUND_REMOVAL_POLICY_DISABLED = 2;
}

enum ColorRangePolicy {
  COLOR_RANGE_POLICY_UNSPECIFIED = 0;
  COLOR_RANGE_POLICY_VIDEO_RANGE = 1;
  COLOR_RANGE_POLICY_FULL_RANGE = 2;
}
