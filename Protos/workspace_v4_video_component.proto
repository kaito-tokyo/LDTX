// Version 4 Workspace Video Component definitions.
syntax = "proto3";

package ldtx.workspace.v4;

import "workspace_v4_vfx.proto";

// Wraps one concrete Video Component definition.
message VideoComponentWrapper {
  oneof definition {
    // The solid-color fill Video Component definition. Mutually exclusive with
    // the other fields.
    FillSolidColorComponent solid_color_fill = 1;
    // The linear-gradient fill Video Component definition. Mutually exclusive
    // with the other fields.
    FillLinearGradientComponent linear_gradient_fill = 2;
    // The radial-gradient fill Video Component definition. Mutually exclusive
    // with the other fields.
    FillRadialGradientComponent radial_gradient_fill = 3;
    // The conic-gradient fill Video Component definition. Mutually exclusive
    // with the other fields.
    FillConicGradientComponent conic_gradient_fill = 4;
    // The VFX Source Video Component definition. Mutually exclusive with the
    // other fields.
    VfxSourceComponent vfx_source = 5;
    // The clock Video Component definition. Mutually exclusive with the other
    // fields.
    ClockComponent clock = 6;
    // The test-pattern Video Component definition. Mutually exclusive with the
    // other fields.
    TestPatternComponent test_pattern = 7;
  }
}

// A Video Component that fills the entire Canvas with one uniform source
// color. The source color at every Canvas point is the value of the color
// field. The conversion to an output or display color space, alpha
// compositing, filtering, and pixel quantization are implementation-defined.
message FillSolidColorComponent {
  // The Workspace-local identifier for this entity. Its most significant bit
  // is zero; bits 62 through 15 encode milliseconds since the Unix epoch,
  // and bits 14 through 0 are uniformly random.
  uint64 internal_id = 1;
  // The name of this Video Component shown in the Workspace sidebar.
  string display_name = 2;
  // The uniform source color of this fill, represented by ExtendedSrgbColor.
  ExtendedSrgbColor color = 3;
}

// A Video Component with linear-gradient control points defined in the local
// coordinate system of the Canvas that renders this Fill. The Canvas origin is
// its top-left corner, x increases to the right, and y increases downward. For
// a Canvas point (x, y) in a Canvas with dimensions (width, height), its
// normalized coordinates are (u, v) = (x / width, y / height). The start and
// end points are (start_x, start_y) and (end_x, end_y) in these normalized
// coordinates. When the points differ, the gradient axis runs from the start
// point to the end point. For a normalized Canvas point p, let s be the start
// point and e the end point; its gradient position is the scalar projection
// t = dot(p - s, e - s) / dot(e - s, e - s). Thus t is zero at s, one at e,
// and is equal for points on the same line perpendicular to the gradient axis.
// For 2D vectors a and b, dot(a, b) = a.x * b.x + a.y * b.y.
// start_color and end_color are the specified colors at their respective
// control points. The colors at other positions, including interpolation,
// alpha handling, compositing, filtering, and pixel quantization, are
// implementation-defined. If the two points coincide, the rendered result is
// implementation-defined.
message FillLinearGradientComponent {
  // The Workspace-local identifier for this entity. Its most significant bit
  // is zero; bits 62 through 15 encode milliseconds since the Unix epoch,
  // and bits 14 through 0 are uniformly random.
  uint64 internal_id = 1;
  // The name of this Video Component shown in the Workspace sidebar.
  string display_name = 2;
  // The normalized horizontal coordinate of the gradient start point, in
  // [0, 1]. Zero is the Canvas's left edge and one is its right edge.
  float start_x = 3;
  // The normalized vertical coordinate of the gradient start point, in
  // [0, 1]. Zero is the Canvas's top edge and one is its bottom edge.
  float start_y = 4;
  // The specified color at the gradient start point.
  ExtendedSrgbColor start_color = 5;
  // The normalized horizontal coordinate of the gradient end point, in
  // [0, 1]. Zero is the Canvas's left edge and one is its right edge.
  float end_x = 6;
  // The normalized vertical coordinate of the gradient end point, in
  // [0, 1]. Zero is the Canvas's top edge and one is its bottom edge.
  float end_y = 7;
  // The specified color at the gradient end point.
  ExtendedSrgbColor end_color = 8;
}

// A Video Component with radial-gradient geometry defined in the local
// coordinate system of the Canvas that renders this Fill. The Canvas origin is
// its top-left corner, x increases to the right, and y increases downward. For
// a Canvas point (x, y) in a Canvas with dimensions (width, height), its
// normalized coordinates are (u, v) = (x / width, y / height). Let c be the
// center (center_x, center_y), and let d = sqrt((u - center_x)^2 +
// (v - center_y)^2). The inner and outer control contours are the sets of
// points where d equals inner_radius and outer_radius. Thus a radius r defines
// an ellipse centered at c with horizontal radius r * width and vertical
// radius r * height.
//
// inner_color and outer_color are the specified source colors on their
// respective control contours. Source colors at all other Canvas points,
// including inside, between, and outside the contours, are implementation-
// defined. Color interpolation, alpha handling, compositing, filtering, and
// pixel quantization are implementation-defined. This definition does not
// require a particular CSS rendering or color interpolation algorithm.
message FillRadialGradientComponent {
  // The Workspace-local identifier for this entity. Its most significant bit
  // is zero; bits 62 through 15 encode milliseconds since the Unix epoch,
  // and bits 14 through 0 are uniformly random.
  uint64 internal_id = 1;
  // The name of this Video Component shown in the Workspace sidebar.
  string display_name = 2;
  // The normalized horizontal coordinate of the gradient center, in [0, 1].
  // Zero is the Canvas's left edge and one is its right edge.
  float center_x = 3;
  // The normalized vertical coordinate of the gradient center, in [0, 1].
  // Zero is the Canvas's top edge and one is its bottom edge.
  float center_y = 4;
  // The inner control contour's radius in normalized Canvas coordinates, in
  // [0, 1]. It must be less than outer_radius.
  float inner_radius = 5;
  // The outer control contour's radius in normalized Canvas coordinates, in
  // [0, 1]. It must be greater than inner_radius.
  float outer_radius = 6;
  // The specified color at the inner control contour.
  ExtendedSrgbColor inner_color = 7;
  // The specified color at the outer control contour.
  ExtendedSrgbColor outer_color = 8;
}

// A Video Component whose conic-gradient geometry is defined in the local
// coordinate system of the Canvas that renders this Fill. The Canvas origin is
// its top-left corner; x increases to the right and y increases downward. For
// a Canvas of positive width W and height H, a point (x, y) has normalized
// coordinates (u, v) = (x / W, y / H). The gradient center is
// c = (center_x, center_y) in these normalized coordinates. At every Canvas
// point other than c, define dx = u - center_x, dy = v - center_y, and
// angle = atan2(dy, dx), in radians, using the conventional atan2(y, x)
// function. Thus zero radians points right and positive angles proceed
// clockwise because the Canvas y-axis points downward. The x and y axes are
// normalized independently, so angles are measured in normalized Canvas
// space, not in pixel space; on a non-square Canvas this can change angular
// spacing compared with pixel-space angles. Define
// q = (angle - start_angle_radians) / (2*pi) and t = q - floor(q), where pi
// is the mathematical constant and floor returns the greatest integer not
// greater than its argument. Thus t is in [0, 1), increases clockwise from
// the start ray, and is periodic in start_angle_radians with period 2*pi.
// Every point on the same ray from c has the same t.
//
// start_color is the specified source color on the start ray (t = 0).
// end_color is the specified source color in the limit as t approaches 1 from
// below. The start ray itself uses start_color; if the endpoint colors differ,
// the angular wrap creates a seam on that ray. These two endpoint colors and
// the geometry above are required. The source color at intermediate angular
// positions, including its interpolation space and progression, alpha
// handling, compositing, filtering, and pixel quantization are implementation-
// defined. The result at the exact center c is implementation-defined because
// its angular position is undefined. This definition does not require the
// angle convention or rendering behavior of CSS conic-gradient(), SwiftUI
// AngularGradient, or any other particular API.
message FillConicGradientComponent {
  // The Workspace-local identifier for this entity. Its most significant bit
  // is zero; bits 62 through 15 encode milliseconds since the Unix epoch,
  // and bits 14 through 0 are uniformly random.
  uint64 internal_id = 1;
  // The name of this Video Component shown in the Workspace sidebar.
  string display_name = 2;
  // The normalized horizontal coordinate of the gradient center, in [0, 1].
  // Zero is the Canvas's left edge and one is its right edge.
  float center_x = 3;
  // The normalized vertical coordinate of the gradient center, in [0, 1].
  // Zero is the Canvas's top edge and one is its bottom edge.
  float center_y = 4;
  // A finite start angle in radians, measured clockwise from the positive
  // horizontal axis in the normalized Canvas coordinate system. Values that
  // differ by an integer multiple of 2 * pi represent the same start ray.
  float start_angle_radians = 5;
  // The specified source color on the start ray (t = 0).
  ExtendedSrgbColor start_color = 6;
  // The specified source color in the limit as t approaches 1 from below,
  // immediately before the angular wrap to the start ray.
  ExtendedSrgbColor end_color = 7;
}

// A Video Component that applies Video Effects to video from an Input Device.
message VfxSourceComponent {
  // The Workspace-local identifier for this entity. Its most significant bit
  // is zero; bits 62 through 15 encode milliseconds since the Unix epoch,
  // and bits 14 through 0 are uniformly random.
  uint64 internal_id = 1;
  // The name of this Video Component shown in the Workspace sidebar.
  string display_name = 2;
  // The Video Input Device that provides this VFX Source's input video. This
  // must not reference a Video Component or an Audio Input Device.
  uint64 input_device_internal_id = 3;
  // The VFX effects applied to the input video, in evaluation order.
  repeated VideoEffectWrapper effects = 4;
}

// A Video Component that renders a test pattern.
message TestPatternComponent {
  // The Workspace-local identifier for this entity. Its most significant bit
  // is zero; bits 62 through 15 encode milliseconds since the Unix epoch,
  // and bits 14 through 0 are uniformly random.
  uint64 internal_id = 1;
  // The name of this Video Component shown in the Workspace sidebar.
  string display_name = 2;
}

// A Video Component that renders the current date and time.
message ClockComponent {
  // The Workspace-local identifier for this entity. Its most significant bit
  // is zero; bits 62 through 15 encode milliseconds since the Unix epoch,
  // and bits 14 through 0 are uniformly random.
  uint64 internal_id = 1;
  // The name of this Video Component shown in the Workspace sidebar.
  string display_name = 2;
  // The Clock width normalized to the fixed 1920-pixel Landscape Canvas width,
  // in [0, 1]. This remains the reference for Portrait projection.
  float width = 3;
  // The Clock height normalized to the fixed 1080-pixel Landscape Canvas
  // height, in [0, 1]. This remains the reference for Portrait projection.
  float height = 4;
  // Whether the rendered Clock includes the date.
  bool shows_date = 5;
  // Whether the rendered time includes seconds.
  bool shows_seconds = 6;
  // Whether the rendered time uses a 24-hour clock.
  bool uses_24_hour_time = 7;
  // The fixed offset from UTC in minutes. When absent, the Clock uses the
  // system time zone.
  optional sint32 utc_offset_minutes = 8;
  // The color of the rendered date and time text.
  ExtendedSrgbColor foreground_color = 9;
  // The background color of this Clock.
  ExtendedSrgbColor background_color = 10;
  // The text outlines rendered around the Clock text, in order.
  repeated ClockTextOutline outlines = 11;
}

// A text outline rendered by a Clock.
message ClockTextOutline {
  // The outline thickness in output pixels.
  float thickness = 1;
  // The color of this outline.
  ExtendedSrgbColor color = 2;
}

// A color represented in the extended sRGB color space.
message ExtendedSrgbColor {
  // The red component in the extended sRGB color space.
  float red = 1;
  // The green component in the extended sRGB color space.
  float green = 2;
  // The blue component in the extended sRGB color space.
  float blue = 3;
  // The straight alpha component, in the range [0, 1].
  float alpha = 4;
}
