// DO NOT EDIT: All the definitions in this file are strictly specified.

edition = "2024";

package ldtx.workspace.v4;

message Rational32 {
  sint32 num = 1;
  uint32 den = 2;
}

message Rational32DefaultOne {
  sint32 num = 1;
  uint32 den = 2;
}

message Color {
  float red = 1;
  float green = 2;
  float blue = 3;
  float alpha = 4;
}

// LdtxInternalId is a Workspace-local entity identifier represented by sfixed64.
// Persisted identifiers must be positive. Their most significant bit (bit 63)
// is zero; bits 62 through 15 encode milliseconds since the Unix epoch,
// and bits 14 through 1 are uniformly random. Bit 0 is always one.
// Negative values are reserved for temporary use and must not be persisted,
// either as entity identifiers or as references.
// Zero represents nil (no identifier or assignment) and is not a valid entity ID.
// References to an entity use its LdtxInternalId within the same Workspace.
