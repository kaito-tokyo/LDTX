edition = "2024";

package ldtx.workspace.v4;

// Contains the persisted output settings for one Workspace.
// These settings may change between output sessions and must remain unchanged
// while recording or streaming is active.
message WorkspaceOutputSettingsV4 {
  // Whether recording output is enabled.
  bool recording_enabled = 1 [default = false];
  // The recording configuration, retained when recording output is disabled.
  RecordingOutputSettings recording_settings = 2;
  // Whether YouTube streaming output is enabled.
  bool youtube_enabled = 3 [default = false];
  // The YouTube streaming configuration, retained when YouTube output is disabled.
  YouTubeOutputSettings youtube_settings = 4;
}

message RecordingOutputSettings {
  // Whether the Landscape output is recorded when recording output is enabled.
  bool records_landscape = 1 [default = false];
  // Whether the Portrait output is recorded when recording output is enabled.
  bool records_portrait = 2 [default = false];
  // Additional fields written to each recording's custom_fields.json,
  // keyed by their field names.
  map<string, string> custom_fields = 3;
}

message YouTubeOutputSettings {
  // The Canvas layout and ingest protocol used for YouTube streaming.
  YouTubeIngestMode ingest_mode = 1 [default = YOUTUBE_INGEST_MODE_UNSPECIFIED];
}

// The layout and protocol used for YouTube ingest.
enum YouTubeIngestMode {
  // No YouTube ingest mode is specified.
  YOUTUBE_INGEST_MODE_UNSPECIFIED = 0;
  // Sends the Landscape output using RTMPS ingest.
  YOUTUBE_INGEST_MODE_LANDSCAPE_RTMPS = 1;
  // Sends the Portrait output using RTMPS ingest.
  YOUTUBE_INGEST_MODE_PORTRAIT_RTMPS = 2;
  // Sends Landscape and Portrait as separate RTMPS streams.
  YOUTUBE_INGEST_MODE_DUAL_RTMPS = 3;
  // Sends the Landscape output using HLS ingest.
  YOUTUBE_INGEST_MODE_LANDSCAPE_HLS = 4;
  // Sends the Portrait output using HLS ingest.
  YOUTUBE_INGEST_MODE_PORTRAIT_HLS = 5;
  // Sends the Landscape output using DASH ingest.
  YOUTUBE_INGEST_MODE_LANDSCAPE_DASH = 6;
  // Sends the Portrait output using DASH ingest.
  YOUTUBE_INGEST_MODE_PORTRAIT_DASH = 7;
}
