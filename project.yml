name: LDTX
configs:
  Debug: debug
  CI: debug
  Release: release
  Distribution: release
options:
  bundleIdPrefix: tokyo.kaito.ldtx
  defaultConfig: Debug
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultSourceDirectoryType: syncedFolder
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.46"
    DEVELOPMENT_TEAM: 4HMJS6J4MZ
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
packages:
  LDTXCore:
    path: .
  SwiftArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.8.2
targets:
  LDTXPlayerApp:
    type: application
    platform: macOS
    sources:
      - Sources/LDTXPlayerAppEntry
    dependencies:
      - package: LDTXCore
        product: LDTXRecordPlayerUI
      - package: LDTXCore
        product: LDTXRecording
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXPlayer.local
        PRODUCT_NAME: LDTX Player
        PRODUCT_MODULE_NAME: LDTXPlayerAppEntry
        INFOPLIST_FILE: Sources/LDTXPlayerAppEntry/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXPlayerAppEntry/LDTXPlayerApp.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXPlayer
  LDTX:
    type: application
    platform: macOS
    sources:
      - Sources/LDTXAppEntry
      - path: Resources/LDTX/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/LDTX/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/Shared/About/Credits.rtf
        buildPhase:
          copyFiles:
            destination: resources
      - path: Sources/LDTXProgramRuntime/Resources/NotoSans/OFL.txt
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXQuickLookPreview
        embed: true
      - target: LDTXQuickLookThumbnail
        embed: true
      - target: LDTXHelper
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXYouTubeOutputServiceProcess
        link: false
        codeSign: true
        embed: true
      - package: LDTXCore
        product: LDTXAppCore
      - package: LDTXCore
        product: LDTXAppUI
      - package: LDTXCore
        product: LDTXFullAppFeatures
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXBackgroundSegmentation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXMediaTiming
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXVision
      - package: LDTXCore
        product: LDTXWorkspace
      - package: LDTXCore
        product: LDTXYouTube
      - package: LDTXCore
        product: LDTXYouTubeAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local
        PRODUCT_NAME: LDTX
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LDTX_FULL_APP"
        LDTX_YOUTUBE_OUTPUT_SERVICE_PROCESS_XPC_SERVICE_NAME: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        LDTX_DOCUMENT_HANDLER_RANK: Owner
        LDTX_MCP_SERVER_NAME: tokyo.kaito.ldtx.recording
        LDTX_MCP_SERVER_EXECUTABLE: LDTXHelper
        INFOPLIST_FILE: Sources/LDTXAppEntry/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXAppEntry/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        CI:
          CODE_SIGN_ENTITLEMENTS: Sources/LDTXAppEntry/LDTX_CI.entitlements
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX
  LDTXQuickLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - Sources/LDTXQuickLookPreview
    info:
      path: Sources/LDTXQuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes:
              - tokyo.kaito.ldtx.recording
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
    entitlements:
      path: Sources/LDTXQuickLookPreview/LDTXQuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local.QuickLookPreview
        PRODUCT_NAME: LDTXQuickLookPreview
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.QuickLookPreview
  LDTXQuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Sources/LDTXQuickLookThumbnail
    info:
      path: Sources/LDTXQuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes:
              - tokyo.kaito.ldtx.recording
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
    entitlements:
      path: Sources/LDTXQuickLookThumbnail/LDTXQuickLookThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local.QuickLookThumbnail
        PRODUCT_NAME: LDTXQuickLookThumbnail
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.QuickLookThumbnail
  LDTXTiny:
    type: application
    platform: macOS
    sources:
      - Sources/LDTXAppEntry
      - path: Resources/LDTXTiny/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/LDTXTiny/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/Shared/About/Credits.rtf
        buildPhase:
          copyFiles:
            destination: resources
      - path: Sources/LDTXProgramRuntime/Resources/NotoSans/OFL.txt
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXTinyHelper
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXTinyYouTubeOutputServiceProcess
        link: false
        codeSign: true
        embed: true
      - package: LDTXCore
        product: LDTXAppCore
      - package: LDTXCore
        product: LDTXAppUI
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXMediaTiming
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXWorkspace
      - package: LDTXCore
        product: LDTXYouTube
      - package: LDTXCore
        product: LDTXYouTubeAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny.local
        PRODUCT_NAME: LDTXTiny
        LDTX_YOUTUBE_OUTPUT_SERVICE_PROCESS_XPC_SERVICE_NAME: tokyo.kaito.ldtx.LDTXTiny.YouTubeOutputServiceProcess
        LDTX_DOCUMENT_HANDLER_RANK: Alternate
        LDTX_MCP_SERVER_NAME: tokyo.kaito.ldtx.tiny.recording
        LDTX_MCP_SERVER_EXECUTABLE: LDTXTinyHelper
        INFOPLIST_FILE: Sources/LDTXAppEntry/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXAppEntry/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        CI:
          CODE_SIGN_ENTITLEMENTS: Sources/LDTXAppEntry/LDTX_CI.entitlements
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny
  LDTXYouTubeOutputServiceProcess:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/LDTXYouTubeOutputServiceProcess
    info:
      path: Sources/LDTXYouTubeOutputServiceProcess/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    dependencies:
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        PRODUCT_NAME: LDTXYouTubeOutputServiceProcess
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXTinyYouTubeOutputServiceProcess:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/LDTXYouTubeOutputServiceProcess
    info:
      path: Sources/LDTXYouTubeOutputServiceProcess/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    dependencies:
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny.YouTubeOutputServiceProcess
        PRODUCT_NAME: LDTXTinyYouTubeOutputServiceProcess
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXHelper:
    type: tool
    platform: macOS
    sources:
      - Sources/LDTXCLI
    dependencies:
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXRecording
      - package: SwiftArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.Helper
        PRODUCT_NAME: LDTXHelper
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  LDTXTinyHelper:
    type: tool
    platform: macOS
    sources:
      - Sources/LDTXCLI
    dependencies:
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXRecording
      - package: SwiftArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny.Helper
        PRODUCT_NAME: LDTXTinyHelper
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  LDTXTinyAppIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXTinyAppIntegrationTests
    dependencies:
      - target: LDTXTiny
      - package: LDTXCore
        product: LDTXAppCore
      - package: LDTXCore
        product: LDTXAppUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTinyAppIntegrationTests
        PRODUCT_NAME: LDTXTinyAppIntegrationTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTXTiny.app/Contents/MacOS/LDTXTiny"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_TEMP_DIR)/$(CONFIGURATION)/LDTXTiny.build/Objects-normal/$(CURRENT_ARCH)"
schemes:
  LDTXPlayerApp:
    build:
      targets:
        LDTXPlayerApp: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Distribution
  LDTX:
    build:
      targets:
        LDTX: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Distribution
  LDTXTiny_CI:
    build:
      targets:
        LDTXTiny: all
    test:
      config: CI
      targets:
        - LDTXTinyAppIntegrationTests
  LDTXTiny:
    build:
      targets:
        LDTXTiny: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Distribution
