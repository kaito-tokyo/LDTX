name: LDTX

fileGroups:
  - Protos
  - pr.xctestplan
  - push-main.xctestplan
  - Easy.xctestplan
  - Medium.xctestplan
  - Hard.xctestplan

configs:
  Debug: debug
  Release: release
  Distribution: release

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: tokyo.kaito.ldtx
  defaultConfig: Debug
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  defaultSourceDirectoryType: syncedFolder

packages:
  AppAuth-iOS:
    url: https://github.com/openid/AppAuth-iOS.git
    exactVersion: 3.0.0
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.39.0
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.2.11"
    DEVELOPMENT_TEAM: 4HMJS6J4MZ
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ENABLE_MODULE_VERIFIER: "YES"
    CLANG_C_LANGUAGE_STANDARD: c11
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "c11 c++20"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    SWIFT_OBJC_INTEROP_MODE: objc

  configs:
    Debug:
      ENABLE_MODULE_VERIFIER: "NO"

include:
  - path: project/frameworks.yml
    relativePaths: false
  - path: project/app.yml
    relativePaths: false
  - path: project/extensions.yml
    relativePaths: false
  - path: project/services.yml
    relativePaths: false
  - path: project/tests-corelibs.yml
    relativePaths: false
  - path: project/tests-modules.yml
    relativePaths: false
  - path: project/tests-output.yml
    relativePaths: false
  - path: project/tests-ui-components.yml
    relativePaths: false
  - path: project/tests-ui.yml
    relativePaths: false
  - path: project/tests-xpc.yml
    relativePaths: false
