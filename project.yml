name: LDTX
configs:
  Debug: debug
  Release: release
  Distribution: release
options:
  bundleIdPrefix: tokyo.kaito.ldtx
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultSourceDirectoryType: syncedFolder
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.27"
    DEVELOPMENT_TEAM: 4HMJS6J4MZ
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
packages:
  LDTXCore:
    path: .
  SwiftArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.8.2
targets:
  LDTX:
    type: application
    platform: macOS
    sources:
      - path: Sources/LDTXApp
        type: group
        excludes:
          - FeatureImplementations/TinyAppFeatureComposition.swift
          - FeatureImplementations/TinyWorkspaceVisionFeature.swift
          - UnavailableVisionRuntimePresenter.swift
      - path: Sources/LDTXAppUI/Program/Audio/AudioPeakMeter.metal
      - path: Sources/LDTXAppUI/Workspace/AudioInputSpectrogram.metal
      - path: LaunchAgents/tokyo.kaito.ldtx.LDTX.BrokerService.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: Resources/LDTX/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/LDTX/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
    dependencies:
      - target: LDTXQuickLookPreview
        embed: true
      - target: LDTXHelper
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXBrokerService
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXYouTubeOutputServiceProcess
        link: false
        codeSign: true
        embed: true
      - target: LDTXAppUI
      - package: LDTXCore
        product: LDTXAutomation
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXBackgroundSegmentation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXMediaTiming
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXVision
      - package: LDTXCore
        product: LDTXWorkspace
      - package: LDTXCore
        product: LDTXYouTube
      - package: LDTXCore
        product: LDTXYouTubeAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local
        PRODUCT_NAME: LDTX
        LDTX_YOUTUBE_OAUTH_CALLBACK_URL_SCHEME: tokyo.kaito.ldtx
        LDTX_YOUTUBE_OUTPUT_SERVICE_PROCESS_XPC_SERVICE_NAME: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        LDTX_DOCUMENT_HANDLER_RANK: Owner
        LDTX_MCP_SERVER_NAME: tokyo.kaito.ldtx.recording
        LDTX_MCP_SERVER_EXECUTABLE: LDTXHelper
        INFOPLIST_FILE: Sources/LDTXApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX
  LDTXQuickLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - Sources/LDTXQuickLookPreview
    info:
      path: Sources/LDTXQuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - tokyo.kaito.ldtx.recording
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
    dependencies:
      - package: LDTXCore
        product: LDTXRecording
    entitlements:
      path: Sources/LDTXQuickLookPreview/LDTXQuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local.QuickLookPreview
        PRODUCT_NAME: LDTXQuickLookPreview
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.QuickLookPreview
  LDTXAppUI:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXAppUI
    dependencies:
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppUI
        PRODUCT_NAME: LDTXAppUI
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
        DEFINES_MODULE: "YES"
        MACH_O_TYPE: staticlib
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXTiny:
    type: application
    platform: macOS
    sources:
      - path: Sources/LDTXApp
        type: group
        excludes:
          - MediaPipeSelfieSegmenter.mlpackage
          - FeatureImplementations/FullAppFeatureComposition.swift
          - FeatureImplementations/FullWorkspaceVisionFeature.swift
          - VisionModelSettingsView.swift
      - path: Sources/LDTXAppUI/Program/Audio/AudioPeakMeter.metal
      - path: Sources/LDTXAppUI/Workspace/AudioInputSpectrogram.metal
      - path: LaunchAgents/tokyo.kaito.ldtx.LDTXTiny.BrokerService.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: Resources/LDTXTiny/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/LDTXTiny/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
    dependencies:
      - target: LDTXTinyHelper
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXTinyBrokerService
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXTinyYouTubeOutputServiceProcess
        link: false
        codeSign: true
        embed: true
      - target: LDTXAppUI
      - package: LDTXCore
        product: LDTXAutomation
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXMediaTiming
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXWorkspace
      - package: LDTXCore
        product: LDTXYouTube
      - package: LDTXCore
        product: LDTXYouTubeAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny.local
        PRODUCT_NAME: LDTXTiny
        LDTX_YOUTUBE_OAUTH_CALLBACK_URL_SCHEME: tokyo.kaito.ldtx.tiny
        LDTX_YOUTUBE_OUTPUT_SERVICE_PROCESS_XPC_SERVICE_NAME: tokyo.kaito.ldtx.LDTXTiny.YouTubeOutputServiceProcess
        LDTX_DOCUMENT_HANDLER_RANK: Alternate
        LDTX_MCP_SERVER_NAME: tokyo.kaito.ldtx.tiny.recording
        LDTX_MCP_SERVER_EXECUTABLE: LDTXTinyHelper
        INFOPLIST_FILE: Sources/LDTXApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny
  LDTXBrokerService:
    type: tool
    platform: macOS
    sources:
      - Sources/LDTXBrokerService
    dependencies:
      - package: LDTXCore
        product: LDTXAutomation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.BrokerService
        PRODUCT_NAME: LDTXBrokerService
        INFOPLIST_KEY_LDTXAutomationMachServiceName: tokyo.kaito.ldtx.LDTX.BrokerService
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXYouTubeOutputServiceProcess:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/LDTXYouTubeOutputServiceProcess
    info:
      path: Sources/LDTXYouTubeOutputServiceProcess/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    dependencies:
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        PRODUCT_NAME: LDTXYouTubeOutputServiceProcess
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXTinyYouTubeOutputServiceProcess:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/LDTXYouTubeOutputServiceProcess
    info:
      path: Sources/LDTXYouTubeOutputServiceProcess/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    dependencies:
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny.YouTubeOutputServiceProcess
        PRODUCT_NAME: LDTXTinyYouTubeOutputServiceProcess
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/LDTXCLI
        excludes:
          - TinyAutomationServiceIdentity.swift
    dependencies:
      - package: LDTXCore
        product: LDTXAutomation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXWorkspace
      - package: SwiftArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.Helper
        PRODUCT_NAME: LDTXHelper
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  LDTXTinyBrokerService:
    type: tool
    platform: macOS
    sources:
      - Sources/LDTXBrokerService
    dependencies:
      - package: LDTXCore
        product: LDTXAutomation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny.BrokerService
        PRODUCT_NAME: LDTXTinyBrokerService
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        INFOPLIST_KEY_LDTXAutomationMachServiceName: tokyo.kaito.ldtx.LDTXTiny.BrokerService
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXTinyHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/LDTXCLI
        excludes:
          - AutomationServiceIdentity.swift
    dependencies:
      - package: LDTXCore
        product: LDTXAutomation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXWorkspace
      - package: SwiftArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXTiny.Helper
        PRODUCT_NAME: LDTXTinyHelper
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  LDTXAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppTests
    dependencies:
      - target: LDTX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppTests
        PRODUCT_NAME: LDTXAppTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_TEMP_DIR)/$(CONFIGURATION)/LDTX.build/Objects-normal/$(CURRENT_ARCH)"
schemes:
  LDTX:
    build:
      targets:
        LDTX: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - LDTXAppTests
    profile:
      config: Release
    archive:
      config: Distribution
  LDTXTiny:
    build:
      targets:
        LDTXTiny: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Distribution
