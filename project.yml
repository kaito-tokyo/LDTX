    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppInterface
        PRODUCT_MODULE_NAME: LDTXAppInterface
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
  LDTXWorkspaceApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXWorkspaceApplet
      - path: Sources/LDTXWorkspaceApplet/UI/Program/Audio/AudioPeakMeter.metal
        buildPhase:
          copyFiles:
            destination: resources
      - path: Sources/LDTXWorkspaceApplet/UI/Workspace/AudioInputSpectrogram.metal
        buildPhase:
          copyFiles:
            destination: resources
      - path: Resources/LDTX/MediaPipeSelfieSegmenter.mlpackage
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXAppInterface
      - target: LDTXAppletSupport
      - target: LDTXAudioEngine
      - target: LDTXBackgroundSegmentation
      - target: LDTXCapture
      - target: LDTXDash
