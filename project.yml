name: LDTX
configs:
  Debug: debug
  CI: debug
  Release: release
  Distribution: release
options:
  bundleIdPrefix: tokyo.kaito.ldtx
  defaultConfig: Debug
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultSourceDirectoryType: syncedFolder
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.50"
    DEVELOPMENT_TEAM: 4HMJS6J4MZ
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
packages:
  LDTXCore:
    path: .
  SwiftArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.8.2
targets:
  LDTXAudioRuntimeEasyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXProgramRuntimeEasyTests
      - Tests/LDTXIntegrationEasyTests
      - Tests/LDTXAudioEngineEasyTests
      - Tests/LDTXCaptureEasyTests
    dependencies:
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AudioRuntimeEasyTests
  LDTXAudioRuntimeHardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXProgramRuntimeHardTests
    dependencies:
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AudioRuntimeHardTests
  LDTXAppLifecycleEasyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppEasyTests
    dependencies:
      - target: LDTXApp
      - target: LDTXWorkspaceApplet
      - target: LDTXRecordPlayerApplet
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXBackgroundSegmentation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXMediaTiming
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXVision
      - package: LDTXCore
        product: LDTXYouTube
      - package: LDTXCore
        product: LDTXYouTubeAuth
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
      - package: LDTXCore
        product: LDTXYouTubeRTMPS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AppLifecycleEasyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LDTXAppLifecycleHardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppHardTests
    dependencies:
      - target: LDTXApp
      - target: LDTXWorkspaceApplet
      - target: LDTXRecordPlayerApplet
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXVision
      - package: LDTXCore
        product: LDTXYouTubeAuth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AppLifecycleHardTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LDTXAppletSupport:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXAppletSupport
    dependencies:
      - package: LDTXCore
        product: LDTXRecording
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppletSupport
        PRODUCT_MODULE_NAME: LDTXAppletSupport
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXRecordPlayerApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXRecordPlayerApplet
    dependencies:
      - target: LDTXAppletSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXRecordPlayerApplet
        PRODUCT_MODULE_NAME: LDTXRecordPlayerApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXLauncherApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXLauncherApplet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXLauncherApplet
        PRODUCT_MODULE_NAME: LDTXLauncherApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
  LDTXWorkspaceApplet:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXWorkspaceApplet
      - path: Sources/LDTXWorkspaceApplet/UI/Program/Audio/AudioPeakMeter.metal
        buildPhase:
          copyFiles:
            destination: resources
      - path: Sources/LDTXWorkspaceApplet/UI/Workspace/AudioInputSpectrogram.metal
        buildPhase:
          copyFiles:
            destination: resources
      - path: Resources/LDTX/MediaPipeSelfieSegmenter.mlpackage
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXAppletSupport
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXBackgroundSegmentation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXMediaTiming
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXVision
      - package: LDTXCore
        product: LDTXYouTube
      - package: LDTXCore
        product: LDTXYouTubeAuth
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
      - package: LDTXCore
        product: LDTXYouTubeRTMPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXWorkspaceApplet
        PRODUCT_MODULE_NAME: LDTXWorkspaceApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXApp:
    type: application
    platform: macOS
    sources:
      - Sources/LDTXApp
      - path: Resources/LDTX/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/LDTX/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/Shared/About/Credits.rtf
        buildPhase:
          copyFiles:
            destination: resources
      - path: Sources/LDTXProgramRuntime/Resources/NotoSans/OFL.txt
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXAppletSupport
        embed: true
        codeSign: true
      - target: LDTXLauncherApplet
        embed: true
        codeSign: true
      - target: LDTXRecordPlayerApplet
        embed: true
        codeSign: true
      - target: LDTXWorkspaceApplet
        embed: true
        codeSign: true
      - target: LDTXQuickLookPreview
        embed: true
      - target: LDTXQuickLookThumbnail
        embed: true
      - target: LDTXHelper
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXYouTubeOutputServiceProcess
        link: false
        codeSign: true
        embed: true
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXBackgroundSegmentation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXInternalProtocols
      - package: LDTXCore
        product: LDTXMediaTiming
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXVision
      - package: LDTXCore
        product: LDTXYouTubeAuth
      - package: LDTXCore
        product: LDTXWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local
        PRODUCT_NAME: LDTX
        PRODUCT_MODULE_NAME: LDTXApp
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        LDTX_YOUTUBE_OUTPUT_SERVICE_PROCESS_XPC_SERVICE_NAME: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        LDTX_DOCUMENT_HANDLER_RANK: Owner
        LDTX_MCP_SERVER_NAME: tokyo.kaito.ldtx.recording
        LDTX_MCP_SERVER_EXECUTABLE: LDTXHelper
        INFOPLIST_FILE: Sources/LDTXApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        CI:
          CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX_CI.entitlements
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX
  LDTXQuickLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - Sources/LDTXQuickLookPreview
    dependencies:
      - package: LDTXCore
        product: LDTXRecording
    info:
      path: Sources/LDTXQuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes:
              - tokyo.kaito.ldtx.recording
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
    entitlements:
      path: Sources/LDTXQuickLookPreview/LDTXQuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local.QuickLookPreview
        PRODUCT_NAME: LDTXQuickLookPreview
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.QuickLookPreview
  LDTXQuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Sources/LDTXQuickLookThumbnail
    dependencies:
      - package: LDTXCore
        product: LDTXRecording
    info:
      path: Sources/LDTXQuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes:
              - tokyo.kaito.ldtx.recording
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
    entitlements:
      path: Sources/LDTXQuickLookThumbnail/LDTXQuickLookThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local.QuickLookThumbnail
        PRODUCT_NAME: LDTXQuickLookThumbnail
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.QuickLookThumbnail
  LDTXYouTubeOutputServiceProcess:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/LDTXYouTubeOutputServiceProcess
    info:
      path: Sources/LDTXYouTubeOutputServiceProcess/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    dependencies:
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        PRODUCT_NAME: LDTXYouTubeOutputServiceProcess
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXHelper:
    type: tool
    platform: macOS
    sources:
      - Sources/LDTXCLI
    dependencies:
      - package: LDTXCore
        product: LDTXDiagnostics
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXWorkspace
      - package: SwiftArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.Helper
        PRODUCT_NAME: LDTXHelper
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  LDTXAppIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppIntegrationTests
    dependencies:
      - target: LDTXApp
      - target: LDTXWorkspaceApplet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppIntegrationTests
        PRODUCT_NAME: LDTXAppIntegrationTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_TEMP_DIR)/$(CONFIGURATION)/LDTX.build/Objects-normal/$(CURRENT_ARCH)"
schemes:
  LDTXAudioRuntimeEasyTests:
    build:
      targets:
        LDTXAudioRuntimeEasyTests: all
    test:
      config: Debug
      targets:
        - LDTXAudioRuntimeEasyTests
  LDTXAudioRuntimeHardTests:
    build:
      targets:
        LDTXAudioRuntimeHardTests: all
    test:
      config: Debug
      targets:
        - LDTXAudioRuntimeHardTests
  LDTXAppLifecycleEasyTests:
    build:
      targets:
        LDTXAppLifecycleEasyTests: all
    test:
      config: Debug
      targets:
        - LDTXAppLifecycleEasyTests
  LDTXAppLifecycleHardTests:
    build:
      targets:
        LDTXAppLifecycleHardTests: all
    test:
      config: Debug
      targets:
        - LDTXAppLifecycleHardTests
  LDTXApp:
    build:
      targets:
        LDTXApp: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Distribution
  LDTX_CI:
    build:
      targets:
        LDTXApp: all
    test:
      config: CI
      targets:
        - LDTXAppIntegrationTests
