name: LDTX
configs:
  Debug: debug
  Release: release
  Distribution: release
options:
  bundleIdPrefix: tokyo.kaito.ldtx
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultSourceDirectoryType: syncedFolder
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.19"
    DEVELOPMENT_TEAM: 4HMJS6J4MZ
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
packages:
  LDTXCore:
    path: .
  SwiftArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.8.2
targets:
  LDTX:
    type: application
    platform: macOS
    sources:
      - path: Sources/LDTXApp
      - path: Sources/LDTXAppUI/Program/Audio/AudioPeakMeter.metal
      - path: Sources/LDTXAppUI/Workspace/AudioInputSpectrogram.metal
      - path: LaunchAgents/tokyo.kaito.ldtx.LDTX.BrokerService.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: Resources/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
    dependencies:
      - target: LDTXHelper
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXBrokerService
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXYouTubeOutputService
        link: false
        codeSign: true
        embed: true
      - target: LDTXAppUI
      - package: LDTXCore
        product: LDTXAutomation
      - package: LDTXCore
        product: LDTXAudioEngine
      - package: LDTXCore
        product: LDTXBackgroundSegmentation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXMediaTiming
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXTaskQueue
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXVision
      - package: LDTXCore
        product: LDTXWorkspace
      - package: LDTXCore
        product: LDTXYouTube
      - package: LDTXCore
        product: LDTXYouTubeAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local
        PRODUCT_NAME: LDTX
        INFOPLIST_FILE: Sources/LDTXApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX
  LDTXAppUI:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXAppUI
    dependencies:
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXProgram
      - package: LDTXCore
        product: LDTXProgramRendering
      - package: LDTXCore
        product: LDTXProgramRuntime
      - package: LDTXCore
        product: LDTXVideoComposition
      - package: LDTXCore
        product: LDTXVideoRendering
      - package: LDTXCore
        product: LDTXVision
      - package: LDTXCore
        product: LDTXWorkspace
      - package: LDTXCore
        product: LDTXYouTube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppUI
        PRODUCT_NAME: LDTXAppUI
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
        DEFINES_MODULE: "YES"
        MACH_O_TYPE: staticlib
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXBrokerService:
    type: tool
    platform: macOS
    sources:
      - Sources/LDTXBrokerService
    dependencies:
      - package: LDTXCore
        product: LDTXAutomation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.BrokerService
        PRODUCT_NAME: LDTXBrokerService
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXYouTubeOutputService:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/LDTXYouTubeOutputService
    info:
      path: Sources/LDTXYouTubeOutputService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    dependencies:
      - package: LDTXCore
        product: LDTXDash
      - package: LDTXCore
        product: LDTXMP4
      - package: LDTXCore
        product: LDTXYouTubeOutputProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.YouTubeOutputService
        PRODUCT_NAME: LDTXYouTubeOutputService
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
  LDTXHelper:
    type: tool
    platform: macOS
    sources:
      - Sources/LDTXCLI
    dependencies:
      - package: LDTXCore
        product: LDTXAutomation
      - package: LDTXCore
        product: LDTXCapture
      - package: LDTXCore
        product: LDTXRecording
      - package: LDTXCore
        product: LDTXWorkspace
      - package: SwiftArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.Helper
        PRODUCT_NAME: LDTXHelper
        GENERATE_INFOPLIST_FILE: "YES"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  LDTXAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppTests
    dependencies:
      - target: LDTX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAppTests
        PRODUCT_NAME: LDTXAppTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_TEMP_DIR)/$(CONFIGURATION)/LDTX.build/Objects-normal/$(CURRENT_ARCH)"
schemes:
  LDTX:
    build:
      targets:
        LDTX: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - LDTXAppTests
    profile:
      config: Release
    archive:
      config: Distribution
