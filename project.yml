name: LDTX
configs:
  Debug: debug
  CI: debug
  Release: release
  Distribution: release
options:
  bundleIdPrefix: tokyo.kaito.ldtx
  defaultConfig: Debug
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultSourceDirectoryType: syncedFolder
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.50"
    DEVELOPMENT_TEAM: 4HMJS6J4MZ
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    SWIFT_OBJC_INTEROP_MODE: objcxx
packages:
  AppAuth-iOS:
    url: https://github.com/openid/AppAuth-iOS.git
    exactVersion: 2.1.0
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
targets:
  LDTXAudioRuntimeEasyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXProgramRuntimeEasyTests
      - Tests/LDTXIntegrationEasyTests
      - Tests/LDTXAudioEngineEasyTests
      - Tests/LDTXCaptureEasyTests
    dependencies:
      - target: LDTXProgramRuntime
      - target: LDTXAudioEngine
      - target: LDTXCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AudioRuntimeEasyTests
  LDTXAudioRuntimeHardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXProgramRuntimeHardTests
    dependencies:
      - target: LDTXProgramRuntime
      - target: LDTXAudioEngine
      - target: LDTXCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AudioRuntimeHardTests
  LDTXAppLifecycleEasyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppEasyTests
    dependencies:
      - target: LDTXApp
      - target: LDTXWorkspaceApplet
      - target: LDTXRecordPlayerApplet
      - target: LDTXAudioEngine
      - target: LDTXBackgroundSegmentation
      - target: LDTXCapture
      - target: LDTXDash
      - target: LDTXDiagnostics
      - target: LDTXInternalProtocols
      - target: LDTXMediaTiming
      - target: LDTXMP4
      - target: LDTXProgram
      - target: LDTXProgramRendering
      - target: LDTXProgramRuntime
      - target: LDTXRecording
      - target: LDTXTaskQueue
      - target: LDTXVideoComposition
      - target: LDTXVideoRendering
      - target: LDTXVision
      - target: LDTXYouTube
      - target: LDTXYouTubeAuth
      - target: LDTXYouTubeOutputProtocol
      - target: LDTXYouTubeRTMPS
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AppLifecycleEasyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LDTXAppLifecycleHardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LDTXAppHardTests
    dependencies:
      - target: LDTXApp
      - target: LDTXWorkspaceApplet
      - target: LDTXRecordPlayerApplet
      - target: LDTXAudioEngine
      - target: LDTXCapture
      - target: LDTXDiagnostics
      - target: LDTXInternalProtocols
      - target: LDTXProgram
      - target: LDTXProgramRuntime
      - target: LDTXRecording
      - target: LDTXVideoComposition
      - target: LDTXVideoRendering
      - target: LDTXVision
      - target: LDTXYouTubeAuth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.AppLifecycleHardTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LDTX.app/Contents/MacOS/LDTX"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LDTXAudioEngine:
    type: framework
    platform: macOS
    sources:
      - Sources/LDTXAudioEngine/AudioMixEngine.cpp
      - Sources/LDTXAudioEngine/WorkspaceAudioEngine.cpp
      - path: Sources/LDTXAudioEngine/include/LDTXAudioEngine.h
        buildPhase: headers
        headerVisibility: public
      - path: Sources/LDTXAudioEngine/include/LDTXAudioEngine/WorkspaceAudioEngine.h
        buildPhase: headers
        headerVisibility: public
      - path: Sources/LDTXAudioEngine/include/LDTXAudioEngine/AudioMixEngine.hpp
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXAudioEngine
        PRODUCT_MODULE_NAME: LDTXAudioEngine
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/LDTXAudioEngine/include $(SRCROOT)/Sources/LDTXAudioEngine/include/LDTXAudioEngine"
        MODULEMAP_FILE: Sources/LDTXAudioEngine/include/module.modulemap
        OTHER_LDFLAGS: "$(inherited) -framework AudioToolbox -framework CoreAudio -framework CoreFoundation -framework CoreMedia"
  LDTXBackgroundSegmentation:
    type: framework
    platform: macOS
    sources:
