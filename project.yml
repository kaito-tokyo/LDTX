      - target: LDTXWorkspaceApplet
      - target: LDTXWorkspace
      - target: LDTXYouTubeAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTXSettingsApplet
        PRODUCT_MODULE_NAME: LDTXSettingsApplet
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
  LDTXApp:
    type: application
    platform: macOS
    sources:
      - Sources/LDTXApp
      - path: Resources/LDTX/MCP/server.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/LDTX/MCP/README.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: MCP
      - path: Resources/Shared/About/Credits.rtf
        buildPhase:
          copyFiles:
            destination: resources
      - path: Sources/LDTXProgramRuntime/Resources/NotoSans/OFL.txt
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - target: LDTXAppInterface
        embed: true
        codeSign: true
      - target: LDTXAppletSupport
        embed: true
        codeSign: true
      - target: LDTXLauncherApplet
        embed: true
        codeSign: true
      - target: LDTXRecordPlayerApplet
        embed: true
        codeSign: true
      - target: LDTXWorkspaceApplet
        embed: true
        codeSign: true
      - target: LDTXSettingsApplet
        embed: true
        codeSign: true
      - target: LDTXQuickLookPreview
        embed: true
      - target: LDTXQuickLookThumbnail
        embed: true
      - target: LDTXHelperTool
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: LDTXYouTubeOutputServiceProcess
        link: false
        codeSign: true
        embed: true
      - target: LDTXAudioEngine
        embed: true
      - target: LDTXBackgroundSegmentation
        embed: true
      - target: LDTXCapture
        embed: true
      - target: LDTXDash
        embed: true
      - target: LDTXDiagnostics
        embed: true
      - target: LDTXInternalProtocols
        embed: true
      - target: LDTXMediaTiming
        embed: true
      - target: LDTXMP4
        embed: true
      - target: LDTXYouTubeOutputProtocol
        embed: true
      - target: LDTXProgram
        embed: true
      - target: LDTXProgramRendering
        embed: true
      - target: LDTXProgramRuntime
        embed: true
      - target: LDTXTaskQueue
        embed: true
      - target: LDTXRecording
        embed: true
      - target: LDTXVideoComposition
        embed: true
      - target: LDTXVideoRendering
        embed: true
      - target: LDTXVision
        embed: true
      - target: LDTXYouTubeAuth
        embed: true
      - target: LDTXYouTube
        embed: true
      - target: LDTXYouTubeRTMPS
        embed: true
      - target: LDTXWorkspace
        embed: true
      - target: LDTXFontRasterizer
        embed: true
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local
        PRODUCT_NAME: LDTX
        PRODUCT_MODULE_NAME: LDTXApp
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        LDTX_YOUTUBE_OUTPUT_SERVICE_PROCESS_XPC_SERVICE_NAME: tokyo.kaito.ldtx.LDTX.YouTubeOutputServiceProcess
        LDTX_DOCUMENT_HANDLER_RANK: Owner
        LDTX_MCP_SERVER_NAME: tokyo.kaito.ldtx.recording
        LDTX_MCP_SERVER_EXECUTABLE: LDTXHelper
        INFOPLIST_FILE: Sources/LDTXApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX.entitlements
        DEAD_CODE_STRIPPING: "YES"
        DISABLE_DIAMOND_PROBLEM_DIAGNOSTIC: "YES"
        DEFINES_MODULE: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        CI:
          CODE_SIGN_ENTITLEMENTS: Sources/LDTXApp/LDTX_CI.entitlements
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) LDTXQuickLookPreview.appex LDTXQuickLookThumbnail.appex"
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX
  LDTXQuickLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - Sources/LDTXQuickLookPreview
    dependencies:
      - target: LDTXRecording
        embed: true
        codeSign: true
    info:
      path: Sources/LDTXQuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes:
              - tokyo.kaito.ldtx.recording
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
    entitlements:
      path: Sources/LDTXQuickLookPreview/LDTXQuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.local.QuickLookPreview
        PRODUCT_NAME: LDTXQuickLookPreview
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SWIFT_OBJC_INTEROP_MODE: objcxx
      configs:
        Distribution:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.kaito.ldtx.LDTX.QuickLookPreview
  LDTXQuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Sources/LDTXQuickLookThumbnail
    dependencies:
      - target: LDTXRecording
        embed: true
        codeSign: true
    info:
      path: Sources/LDTXQuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: LDTX Recording Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
