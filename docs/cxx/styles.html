<h1>Guidelines for C++ styles</h1>

<h2>General guidelines</h2>
<ul>
<li>Always prefer C++ standard library types and facilities over platform-specific ones. Example: use <code>std::uint32_t</code> instead of <code>UInt32</code>.</li>
</ul>
